<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>IPTV工具集 - LOGO模糊搜索</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", Arial, sans-serif;
        }
        body {
            background: #f5f5f5;
            padding: 15px;
            max-width: 800px;
            margin: 0 auto;
        }
        .container {
            background: #fff;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,.08);
        }
        h1 {
            font-size: 18px;
            text-align: center;
            margin-bottom: 20px;
            color: #333;
        }
        /* LOGO模糊搜索模块 */
        .logo-search {
            margin-bottom: 20px;
            padding-bottom: 20px;
            border-bottom: 1px solid #eee;
        }
        .search-bar {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }
        .search-bar input {
            flex: 1;
            padding: 12px 16px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
        }
        .search-bar button {
            padding: 0 20px;
            background: #1677ff;
            color: #fff;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }
        .loading {
            text-align: center;
            color: #1677ff;
            font-size: 14px;
            padding: 20px;
            display: none;
        }
        .logo-result {
            max-height: 300px;
            overflow-y: auto;
            border: 1px solid #eee;
            border-radius: 8px;
            padding: 10px;
            display: none;
        }
        .logo-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px;
            border-bottom: 1px solid #f5f5f5;
            cursor: pointer;
        }
        .logo-item:last-child {
            border-bottom: none;
        }
        .logo-item:hover {
            background: #fafafa;
        }
        .logo-item .preview {
            width: 60px;
            height: 30px;
            border: 1px solid #eee;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        .logo-item .preview img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
        .logo-item .preview .placeholder {
            color: #999;
            font-size: 10px;
        }
        .logo-item .info {
            flex: 1;
        }
        .logo-item .name {
            font-size: 14px;
            color: #333;
            margin-bottom: 4px;
        }
        .logo-item .url {
            font-size: 12px;
            color: #666;
            word-break: break-all;
        }
        .logo-item .copy-btn {
            padding: 4px 12px;
            font-size: 12px;
            background: #1677ff;
            color: #fff;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            white-space: nowrap;
        }
        /* 原有工具样式 */
        .input-item {
            margin-bottom: 12px;
        }
        .input-item label {
            font-size: 14px;
            color: #555;
            display: block;
            margin-bottom: 4px;
        }
        input, textarea {
            width: 100%;
            padding: 10px 16px;
            border: 1px solid #ddd;
            border-radius: 8px;
            background: #fafafa;
        }
        textarea {
            min-height: 160px;
            resize: vertical;
        }
        .checkbox-item {
            display: flex;
            align-items: center;
            margin: 8px 0;
            font-size: 14px;
            color: #555;
        }
        .checkbox-item input {
            margin-right: 6px;
            width: auto;
        }
        .btn-group {
            display: flex;
            gap: 6px;
            margin: 10px 0;
            flex-wrap: wrap;
        }
        button {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 8px;
            background: #1677ff;
            color: #fff;
            cursor: pointer;
        }
        button.gray {
            background: #666;
        }
        .func-btn {
            display: flex;
            gap: 10px;
            margin: 15px 0;
        }
        .upload {
            margin: 10px 0;
        }
        .upload input {
            border: none;
            padding: 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>IPTV工具集 - LOGO模糊搜索</h1>

        <!-- LOGO模糊搜索模块 -->
        <div class="logo-search">
            <h3 style="font-size:16px; margin-bottom:10px; color:#333;">频道LOGO模糊搜索</h3>
            <div class="search-bar">
                <input type="text" id="searchKey" placeholder="输入关键词（如CCTV、4K、BBC）">
                <button onclick="fuzzySearchLogo()">模糊搜索</button>
            </div>
            <div class="loading" id="loading">正在拉取LOGO列表...</div>
            <div id="logoResult" class="logo-result"></div>
        </div>

        <!-- 原有转换工具模块 -->
        <div class="input-item">
            <label>EPG 地址</label>
            <input id="epgUrl" value="https://ie.erw.cc/all.xml.gz">
        </div>
        <div class="input-item">
            <label>Logo 基础地址（结尾 /）</label>
            <input id="logoUrlInput" value="https://cdn.jsdelivr.net/gh/1996TV/LOGO@main/">
        </div>
        <div class="checkbox-item">
            <input type="checkbox" id="cleanName" checked>
            <label>净化频道名</label>
        </div>
        <div class="checkbox-item">
            <input type="checkbox" id="removeReplay" checked>
            <label>去除回看 / 回放 / 时移频道</label>
        </div>
        <div class="input-item">
            <label>旧链接前缀</label>
            <input id="oldLinkPrefix">
        </div>
        <div class="input-item">
            <label>新链接前缀</label>
            <input id="newLinkPrefix">
        </div>
        <div class="checkbox-item">
            <input type="checkbox" id="enableLinkReplace" checked>
            <label>启用链接替换</label>
        </div>
        <div class="upload">
            <input type="file" id="fileInput" accept=".txt,.m3u,.m3u8" onchange="readFile(this)">
        </div>
        <textarea id="inputContent" placeholder="粘贴或上传 TXT / M3U 内容"></textarea>
        
        <div class="btn-group">
            <button onclick="txtToM3u()">TXT → M3U</button>
            <button onclick="m3uToTxt()">M3U → TXT</button>
            <button onclick="onlyReplaceLink()">只替换链接</button>
            <button onclick="clearAll()">清空</button>
        </div>

        <div class="func-btn">
            <button onclick="downloadResult()">下载结果</button>
            <button onclick="copyResult()">复制结果</button>
        </div>

        <textarea id="output" placeholder="处理结果" readonly></textarea>
    </div>

    <script>
        // 仓库配置
        const repoOwner = "1996TV";
        const repoName = "LOGO";
        const cdnBase = `https://cdn.jsdelivr.net/gh/${repoOwner}/${repoName}@main/`;
        let allLogoFiles = []; // 存储仓库所有LOGO文件

        // 模糊搜索LOGO核心函数（完全忽略大小写）
        async function fuzzySearchLogo() {
            const key = document.getElementById('searchKey').value.trim().toLowerCase();
            if (!key) {
                alert('请输入搜索关键词！');
                return;
            }

            const loading = document.getElementById('loading');
            const resultBox = document.getElementById('logoResult');
            
            // 显示加载状态
            loading.style.display = 'block';
            resultBox.style.display = 'none';

            try {
                // 首次搜索拉取仓库文件列表
                if (allLogoFiles.length === 0) {
                    await fetchLogoFiles();
                }

                // 🔥 核心优化：文件名称转小写后匹配，彻底忽略大小写
                const matchFiles = allLogoFiles.filter(file => 
                    file.name.toLowerCase().includes(key)
                );

                // 渲染结果
                loading.style.display = 'none';
                resultBox.style.display = 'block';
                
                if (matchFiles.length === 0) {
                    resultBox.innerHTML = '<p style="text-align:center; color:#999; padding:20px;">未找到匹配的LOGO文件</p>';
                    return;
                }

                let resultHtml = '';
                matchFiles.forEach(file => {
                    const logoName = file.name.replace('.png', '');
                    const logoCdnUrl = cdnBase + file.name;
                    resultHtml += `
                        <div class="logo-item">
                            <div class="preview">
                                <img src="${logoCdnUrl}" alt="${logoName}" onerror="this.parentNode.innerHTML='<span class=placeholder>加载失败</span>'">
                            </div>
                            <div class="info">
                                <div class="name">${logoName}</div>
                                <div class="url">${logoCdnUrl}</div>
                            </div>
                            <button class="copy-btn" onclick="copyLogoUrl('${logoCdnUrl}')">复制</button>
                        </div>
                    `;
                });
                resultBox.innerHTML = resultHtml;

            } catch (error) {
                loading.style.display = 'none';
                resultBox.style.display = 'block';
                resultBox.innerHTML = `<p style="text-align:center; color:#f5222d; padding:20px;">搜索失败：${error.message}</p>`;
                console.error('LOGO搜索失败', error);
            }
        }

        // 从GitHub API拉取仓库文件列表
        async function fetchLogoFiles() {
            const apiUrl = `https://api.github.com/repos/${repoOwner}/${repoName}/contents/`;
            const response = await fetch(apiUrl);
            
            if (!response.ok) {
                throw new Error(`GitHub API请求失败（${response.status}）`);
            }

            const files = await response.json();
            // 筛选PNG文件并去重
            allLogoFiles = files
                .filter(file => file.type === 'file' && file.name.endsWith('.png'))
                .map(file => ({ name: file.name, downloadUrl: file.download_url }));
        }

        // 复制LOGO链接
        function copyLogoUrl(url) {
            navigator.clipboard.writeText(url)
                .then(() => alert('LOGO链接复制成功！'))
                .catch(() => {
                    // 降级复制方案
                    const textarea = document.createElement('textarea');
                    textarea.value = url;
                    document.body.appendChild(textarea);
                    textarea.select();
                    document.execCommand('copy');
                    document.body.removeChild(textarea);
                    alert('LOGO链接复制成功！');
                });
        }

        // ========== 原有工具功能 ==========
        // 读取上传文件
        function readFile(input) {
            const file = input.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = e => document.getElementById('inputContent').value = e.target.result;
            reader.readAsText(file);
        }

        // 下载结果
        function downloadResult() {
            const content = document.getElementById('output').value.trim();
            if (!content) return alert('暂无内容可下载！');
            const ext = content.startsWith('#EXTM3U') ? 'm3u' : 'txt';
            const blob = new Blob([content], { type: 'text/plain' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = `iptv_${Date.now()}.${ext}`;
            a.click();
            URL.revokeObjectURL(a.href);
        }

        // 复制结果
        function copyResult() {
            const content = document.getElementById('output').value.trim();
            if (!content) return alert('暂无内容可复制！');
            navigator.clipboard.writeText(content)
                .then(() => alert('结果复制成功！'))
                .catch(() => {
                    const ta = document.createElement('textarea');
                    ta.value = content;
                    document.body.appendChild(ta);
                    ta.select();
                    document.execCommand('copy');
                    document.body.removeChild(ta);
                    alert('结果复制成功！');
                });
        }

        // 频道名净化
        function cleanNameFn(n) {
            return document.getElementById('cleanName').checked 
                ? n.replace(/高清|HD|超清/g, '').replace(/\s+/g, '') 
                : n;
        }

        // 检测回看频道
        function isReplay(n) {
            return /(回看|回放|时移|Replay|Catchup|重播)/i.test(n);
        }

        // TXT转M3U
        function txtToM3u() {
            const epg = document.getElementById('epgUrl').value.trim();
            const logoBase = document.getElementById('logoUrlInput').value.replace(/\/$/, '') + '/';
            const lines = document.getElementById('inputContent').value.split('\n');
            let output = `#EXTM3U x-tvg-url="${epg}"\n`;
            let group = '';

            lines.forEach(l => {
                l = l.trim();
                if (!l) return;
                if (l.endsWith(',#genre#')) {
                    group = l.replace(',#genre#', '');
                    return;
                }
                if (!l.includes(',')) return;

                const [name, url] = l.split(',');
                if (document.getElementById('removeReplay').checked && isReplay(name)) return;
                
                const cleanName = cleanNameFn(name);
                let playUrl = url;
                if (document.getElementById('enableLinkReplace').checked) {
                    const oldPrefix = document.getElementById('oldLinkPrefix').value.trim();
                    const newPrefix = document.getElementById('newLinkPrefix').value.trim();
                    if (oldPrefix && newPrefix) playUrl = playUrl.replace(oldPrefix, newPrefix);
                }

                output += `#EXTINF:-1 tvg-name="${cleanName}" tvg-logo="${logoBase}${cleanName}.png" group-title="${group}",${cleanName}\n${playUrl}\n`;
            });

            document.getElementById('output').value = output;
        }

        // M3U转TXT
        function m3uToTxt() {
            const lines = document.getElementById('inputContent').value.split('\n');
            let output = '';
            let currentGroup = '';

            for (let i = 0; i < lines.length; i++) {
                const line = lines[i].trim();
                if (line.startsWith('#EXTINF')) {
                    const nameMatch = line.match(/,(.*)$/);
                    const groupMatch = line.match(/group-title="([^"]+)"/);
                    const name = nameMatch ? nameMatch[1].trim() : '';
                    const group = groupMatch ? groupMatch[1] : '默认分类';

                    if (document.getElementById('removeReplay').checked && isReplay(name)) {
                        i++;
                        continue;
                    }

                    if (group !== currentGroup) {
                        output += `${group},#genre#\n`;
                        currentGroup = group;
                    }

                    let url = lines[i + 1] ? lines[i + 1].trim() : '';
                    if (document.getElementById('enableLinkReplace').checked) {
                        const oldPrefix = document.getElementById('oldLinkPrefix').value.trim();
                        const newPrefix = document.getElementById('newLinkPrefix').value.trim();
                        if (oldPrefix && newPrefix) url = url.replace(oldPrefix, newPrefix);
                    }

                    const cleanName = cleanNameFn(name);
                    output += `${cleanName},${url}\n`;
                    i++;
                }
            }

            document.getElementById('output').value = output;
        }

        // 只替换链接
        function onlyReplaceLink() {
            const content = document.getElementById('inputContent').value;
            const oldPrefix = document.getElementById('oldLinkPrefix').value.trim();
            const newPrefix = document.getElementById('newLinkPrefix').value.trim();
            if (!oldPrefix || !newPrefix) return alert('请填写新旧链接前缀！');
            document.getElementById('output').value = content.replaceAll(oldPrefix, newPrefix);
        }

        // 清空所有
        function clearAll() {
            document.getElementById('searchKey').value = '';
            document.getElementById('logoResult').style.display = 'none';
            document.getElementById('inputContent').value = '';
            document.getElementById('output').value = '';
            allLogoFiles = []; // 重置LOGO文件列表
        }
    </script>
</body>
</html>
