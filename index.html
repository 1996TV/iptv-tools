<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>TXT⇌M3U转换（手机完整带上传下载）</title>
    <style>
        * {margin:0;padding:0;box-sizing:border-box;}
        body {padding:15px;background:#f5f5f5;font-family:Arial;}
        .box {max-width:600px;margin:0 auto;background:#fff;padding:20px;border-radius:8px;box-shadow:0 1px 3px #ccc;}
        h1 {text-align:center;font-size:18px;margin-bottom:20px;color:#333;}
        .opt {margin:10px 0;}
        .opt label {font-size:14px;color:#666;}
        .opt input {width:100%;padding:8px;border:1px solid #ddd;border-radius:4px;margin-top:5px;font-size:14px;}
        .chk {display:flex;align-items:center;margin:8px 0;font-size:14px;}
        .chk input {width:14px;height:14px;margin-right:8px;}
        .upload-box {display:flex;align-items:center;margin:15px 0;padding:10px;border:1px dashed #ddd;border-radius:4px;}
        .upload-btn {padding:8px 15px;background:#1677ff;color:#fff;border:none;border-radius:4px;font-size:14px;cursor:pointer;}
        #fileInput {display:none;}
        .file-tip {font-size:13px;color:#999;margin-left:10px;flex:1;}
        textarea {width:100%;height:150px;padding:10px;border:1px solid #ddd;border-radius:4px;margin:10px 0;font-size:14px;resize:none;}
        .btn {width:100%;padding:10px;background:#1677ff;color:#fff;border:none;border-radius:4px;margin:5px 0;font-size:14px;cursor:pointer;}
        .btn-group {display:flex;gap:5px;margin:10px 0;}
        .btn-group button {flex:1;padding:10px;}
        .down-select {width:100%;padding:8px;border:1px solid #ddd;border-radius:4px;margin:5px 0;font-size:14px;}
    </style>
</head>
<body>
    <div class="box">
        <h1>TXT⇌M3U（繁转简+📡+上传下载）</h1>
        
        <!-- 原格式不变的EPG+Logo -->
        <div class="opt">
            <label>EPG 地址</label>
            <input id="epgUrl" value="https://ie.erw.cc/all.xml.gz" placeholder="EPG地址">
        </div>
        <div class="opt">
            <label>Logo地址（结尾带/）</label>
            <input id="logoUrl" value="https://cdn.jsdelivr.net/gh/1996TV/LOGO1@main/icon/" placeholder="Logo基础地址">
        </div>

        <!-- 原功能开关 -->
        <div class="chk">
            <input type="checkbox" id="toSimplified" checked>
            <label>自动繁转简</label>
        </div>
        <div class="chk">
            <input type="checkbox" id="cleanName" checked>
            <label>净化频道名（去高清/HD等）</label>
        </div>

        <!-- ✅修复版上传功能（手机兼容） -->
        <div class="upload-box">
            <label for="fileInput" class="upload-btn">选择文件</label>
            <input type="file" id="fileInput" accept=".txt,.m3u,.m3u8">
            <span class="file-tip" id="fileTip">支持TXT/M3U，点击选择</span>
        </div>

        <textarea id="inputTxt" placeholder="粘贴内容 或 上传文件（示例：🇨🇳国内卫视📡,#genre# 广东卫视,链接）"></textarea>
        
        <div class="btn-group">
            <button class="btn" onclick="txtToM3u()">TXT → M3U</button>
            <button class="btn" onclick="m3uToTxt()">M3U → TXT</button>
        </div>

        <textarea id="outputTxt" placeholder="转换结果在这里..." readonly></textarea>
        
        <!-- ✅修复版下载功能 -->
        <select class="down-select" id="downloadType">
            <option value="m3u">下载为 .m3u</option>
            <option value="txt">下载为 .txt</option>
        </select>
        <div class="btn-group">
            <button class="btn" onclick="copyTxt()">复制结果</button>
            <button class="btn" onclick="downloadResult()">下载文件</button>
        </div>
        <button class="btn" onclick="clearTxt()">清空内容</button>
    </div>

    <script>
        // 元素获取（格式不变）
        const epgUrl = document.getElementById('epgUrl');
        const logoUrl = document.getElementById('logoUrl');
        const toSimplified = document.getElementById('toSimplified');
        const cleanName = document.getElementById('cleanName');
        const inputTxt = document.getElementById('inputTxt');
        const outputTxt = document.getElementById('outputTxt');
        const fileInput = document.getElementById('fileInput');
        const fileTip = document.getElementById('fileTip');
        const downloadType = document.getElementById('downloadType');

        // ✅1.修复手机上传（核心：强制UTF8+错误提示）
        fileInput.addEventListener('change',function(e){
            const file = e.target.files[0];
            if(!file){fileTip.textContent='未选择文件';return;}
            // 校验文件类型
            const ext = file.name.split('.').pop().toLowerCase();
            if(!['txt','m3u','m3u8'].includes(ext)){
                alert('只能选TXT/M3U文件！');
                fileInput.value='';
                return;
            }
            fileTip.textContent=`已选：${file.name}`;
            const reader = new FileReader();
            reader.onload = function(e){
                // 上传后自动繁转简
                inputTxt.value = toSimple(e.target.result);
            };
            reader.onerror = ()=>{alert('读取失败，换自带浏览器试试');fileInput.value='';};
            // 手机关键：强制UTF8编码，不乱码
            reader.readAsText(file,'UTF-8');
        });

        // 繁转简（完整版，格式不变）
        function toSimple(str) {
            if (!toSimplified.checked) return str;
            const map = {
                '國':'国','衛':'卫','廣':'广','頻':'频','電':'电','劇':'剧','經':'经','資':'资','體':'体','綜':'综','娛':'娱',
                '電影':'电影','新聞':'新闻','財經':'财经','時事':'时事','國際':'国际','籃球':'篮球','足球':'足球','脫口秀':'脱口秀'
            };
            for(let [f,j] of Object.entries(map)) str = str.replace(new RegExp(f,'g'),j);
            return str;
        }

        // 净化频道名（和原格式一致）
        function cleanChannelName(name) {
            if (!cleanName.checked) return name;
            return name.replace(/\s+/g,'').replace(/高清|HD|超清|频道|卫视/g,'').replace(/[^a-zA-Z0-9\u4e00-\u9fa5]/g,'');
        }

        // ✅2.TXT转M3U（格式和之前完全一样，不改动）
        function txtToM3u() {
            const input = toSimple(inputTxt.value.trim());
            if (!input) {alert('请输入/上传内容');return;}
            let lines = input.split('\n').filter(line=>line.trim());
            // 保留原格式EPG字段
            let m3u = `#EXTM3U x-tvg-url="${epgUrl.value.trim()}"\n`;
            let group = '';
            const logoBase = logoUrl.value.trim().replace(/\/$/,'') + '/';

            lines.forEach(line=>{
                line = line.trim();
                if (line.endsWith(',#genre#')) {
                    group = line.replace(',#genre#','').trim();
                    return;
                }
                if (line.includes(',')) {
                    let [name, url] = line.split(',');
                    name = name.trim();url = url.trim();
                    const fmtName = cleanChannelName(name);
                    // 原格式完全不变
                    m3u += `#EXTINF:-1 tvg-id="${fmtName}" tvg-name="${fmtName}" tvg-logo="${logoBase}${fmtName}.png" group-title="${group}",${fmtName}\n${url}\n`;
                }
            });
            outputTxt.value = m3u;
        }

        // ✅3.M3U转TXT（格式和之前完全一样，保留📡）
        function m3uToTxt() {
            const input = toSimple(inputTxt.value.trim());
            if (!input) {alert('请输入/上传内容');return;}
            let lines = input.split('\n').filter(line=>line.trim());
            let txt = '';let lastGroup = '';
            for(let i=0; i<lines.length; i++) {
                let line = lines[i].trim();
                if(line.startsWith('#EXTM3U')) continue;
                if (line.startsWith('#EXTINF')) {
                    let groupMatch = line.match(/group-title="([^"]+)"/);
                    let nameMatch = line.match(/tvg-name="([^"]+)"/);
                    if (groupMatch && nameMatch) {
                        let group = groupMatch[1].trim();
                        let name = nameMatch[1].trim();
                        let url = lines[i+1] ? lines[i+1].trim() : '';
                        if (group !== lastGroup) {
                            txt += `${group},#genre#\n`;lastGroup = group;
                        }
                        if (url) txt += `${name},${url}\n`;
                        i++;
                    }
                }
            }
            outputTxt.value = txt;
        }

        // ✅4.修复手机下载（安卓直接下，iOS提示长按）
        function downloadResult(){
            const content = outputTxt.value.trim();
            if(!content){alert('暂无转换结果');return;}
            const type = downloadType.value;
            const filename = `iptv.${type}`;
            // 手机兼容核心：Blob+UTF8防乱码
            const blob = new Blob([content],{type:'text/plain;charset=UTF-8'});
            const blobUrl = URL.createObjectURL(blob);
            
            const isIOS = /iPhone|iPad|iPod/.test(navigator.userAgent);
            if(isIOS){
                // iOS：提示长按保存
                const a = document.createElement('a');
                a.href = blobUrl;
                a.style.display='none';
                document.body.appendChild(a);
                a.click();
                alert('iOS请长按弹出的内容，选择【添加到备忘录】或【存储文件】');
            }else{
                // 安卓：直接下载
                const a = document.createElement('a');
                a.href = blobUrl;
                a.download = filename;
                document.body.appendChild(a);
                a.click();
            }
            document.body.removeChild(a);
            URL.revokeObjectURL(blobUrl);
        }

        // 复制+清空（手机兼容）
        function copyTxt() {
            if (!outputTxt.value) {alert('暂无结果');return;}
            outputTxt.select();
            document.execCommand('copy');
            alert('复制成功，可直接粘贴使用');
        }
        function clearTxt() {
            inputTxt.value = '';
            outputTxt.value = '';
            fileInput.value = '';
            fileTip.textContent='支持TXT/M3U，点击选择';
        }
    </script>
</body>
</html>
