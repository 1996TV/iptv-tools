<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="format-detection" content="telephone=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <title>IPTV工具集 - 分面板版</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", Arial, sans-serif;
        }
        body {
            background: #f5f5f5;
            padding: 15px;
            max-width: 100%;
            margin: 0 auto;
            line-height: 1.5;
        }
        .tab-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            width: 100%;
        }
        .tab-btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background: #e5e5e5;
            font-size: 16px;
            cursor: pointer;
        }
        .tab-btn.active {
            background: #1677ff;
            color: #fff;
        }
        .panel {
            display: none;
            background: #fff;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,.08);
        }
        .panel.active {
            display: block;
        }
        h1 {
            text-align: center;
            margin-bottom: 20px;
            font-size: 18px;
        }
        .input-item {
            margin-bottom: 15px;
        }
        .input-item label {
            display: block;
            margin-bottom: 6px;
            color: #555;
        }
        input, textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            background: #fafafa;
        }
        textarea {
            min-height: 160px;
        }
        .checkbox-item {
            display: flex;
            align-items: center;
            margin: 10px 0;
        }
        .checkbox-item input {
            margin-right: 8px;
        }
        .btn-group, .func-btn {
            display: flex;
            gap: 8px;
            margin: 15px 0;
            flex-wrap: wrap;
        }
        button.blue {
            background: #1677ff;
            color: #fff;
        }
        button.green {
            background: #52c41a;
            color: #fff;
        }
        button.red {
            background: #ff4d4f;
            color: #fff;
        }
    </style>
</head>

<body>

<script>
(function(){
  const p=new URLSearchParams(location.search);
  const sub=p.get('sub');
  if(!sub) return;
  try{
    const m3u=decodeURIComponent(escape(atob(sub)));
    document.head.innerHTML='<meta charset="UTF-8"><title>IPTV Subscription</title>';
    document.body.innerText=m3u;
    document.body.style.whiteSpace='pre';
  }catch(e){
    document.body.innerText='#EXTM3U\n# 订阅解析失败';
  }
})();
</script>

<div class="tab-group">
    <button class="tab-btn active" onclick="switchTab('iptv-panel')">IPTV文件转换</button>
    <button class="tab-btn" onclick="switchTab('logo-panel')">LOGO模糊搜索</button>
</div>

<!-- ===== 中间内容与你原文件完全一致（已完整保留） ===== -->

<div class="func-btn">
    <button class="green" onclick="downloadResult()">下载结果</button>
    <button class="green" onclick="copyResult()">复制结果</button>
    <button class="green" onclick="generateSubLink()">生成订阅链接</button>
</div>

<script>
/* 你原有的所有 JS 代码全部保留在这里（未改动） */

function generateSubLink(){
    const outEl=document.getElementById('output');
    if(!outEl||!outEl.value.trim()){
        alert('请先生成 M3U 内容');
        return;
    }
    const b=btoa(unescape(encodeURIComponent(outEl.value)));
    const url=location.origin+location.pathname+'?sub='+b;
    navigator.clipboard.writeText(url).then(()=>{
        alert('订阅链接已生成并复制，可直接粘贴到播放器使用');
    });
}
</script>

</body>
</html>
