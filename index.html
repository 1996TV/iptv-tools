<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="format-detection" content="telephone=no">
<title>IPTV工具集</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",Arial}
body{background:#f5f5f5;padding:15px}
.tab-group{display:flex;gap:10px;margin-bottom:20px}
.tab-btn{flex:1;padding:12px;border:0;border-radius:8px;background:#e5e5e5;font-size:16px}
.tab-btn.active{background:#1677ff;color:#fff}
.panel{display:none;background:#fff;padding:20px;border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.panel.active{display:block}
h1{text-align:center;margin-bottom:20px;font-size:18px}

.input-item{margin-bottom:15px}
.input-item label{display:block;margin-bottom:6px;color:#555}
input,textarea{width:100%;padding:12px;border:1px solid #ddd;border-radius:8px;background:#fafafa}
textarea{min-height:160px}

.checkbox-item{display:flex;align-items:center;margin:10px 0}
.checkbox-item input{margin-right:8px}

.btn-group,.func-btn{display:flex;gap:8px;margin:15px 0;flex-wrap:wrap}
button{flex:1;padding:12px;border:0;border-radius:8px;color:#fff}
.blue{background:#1677ff}
.green{background:#52c41a}
.red{background:#ff4d4f}
</style>
</head>

<body>

<!-- ========= 订阅接口模式（最关键） ========= -->
<script>
(function handleSubRequest(){
    const p=new URLSearchParams(location.search);
    const sub=p.get("sub");
    if(!sub)return;
    try{
        const m3u=decodeURIComponent(escape(atob(sub)));
        document.head.innerHTML='<meta charset="UTF-8"><title>IPTV Subscription</title>';
        document.body.innerText=m3u;
    }catch(e){
        document.body.innerText="#EXTM3U\n# 订阅解析失败";
    }
})();
</script>

<div class="tab-group">
    <button class="tab-btn active" onclick="switchTab('iptv')">IPTV文件转换</button>
</div>

<div class="panel active" id="iptv">
<h1>IPTV 工具集</h1>

<div class="input-item">
<label>EPG 地址</label>
<input id="epgUrl" value="https://epg.catvod.com/epg.xml">
</div>

<div class="input-item">
<label>Logo 基础地址</label>
<input id="logoUrlInput" value="https://cdn.jsdelivr.net/gh/1996TV/LOGO@main/">
</div>

<div class="checkbox-item">
<input type="checkbox" id="cleanName" checked>
<label>净化频道名</label>
</div>

<div class="checkbox-item">
<input type="checkbox" id="removeReplay" checked>
<label>去除回看 / 时移</label>
</div>

<textarea id="inputContent" placeholder="粘贴 TXT / M3U 内容"></textarea>

<div class="btn-group">
<button class="blue" onclick="txtToM3u()">TXT → M3U</button>
<button class="blue" onclick="m3uToTxt()">M3U → TXT</button>
<button class="red" onclick="clearAll()">清空</button>
</div>

<div class="func-btn">
<button class="green" onclick="downloadResult()">下载结果</button>
<button class="green" onclick="copyResult()">复制结果</button>
</div>

<div class="func-btn">
<button class="green" onclick="generateSubLink()">生成订阅链接</button>
</div>

<div class="input-item">
<label>订阅地址（复制到播放器）</label>
<input id="subLinkOutput" readonly>
</div>

<textarea id="output" placeholder="处理结果" readonly></textarea>
</div>

<script>
function switchTab(id){
    document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
    document.getElementById(id).classList.add('active');
}

function cleanNameFn(n){
    if(!document.getElementById('cleanName').checked)return n;
    return n.replace(/高清|HD|超清/gi,'').trim();
}
function isReplay(n){return /(回看|回放|时移)/i.test(n);}

function txtToM3u(){
    const epg=document.getElementById('epgUrl').value;
    const logo=document.getElementById('logoUrlInput').value;
    const input=document.getElementById('inputContent').value.trim();
    if(!input)return alert("没内容");
    let out=`#EXTM3U x-tvg-url="${epg}"\n`;
    let group="";
    input.split('\n').forEach(l=>{
        l=l.trim();
        if(!l)return;
        if(l.endsWith(',#genre#')){group=l.replace(',#genre#','');return;}
        if(!l.includes(','))return;
        let [n,u]=l.split(',');
        if(isReplay(n)&&document.getElementById('removeReplay').checked)return;
        n=cleanNameFn(n);
        out+=`#EXTINF:-1 tvg-name="${n}" tvg-logo="${logo}${n}.png" group-title="${group}",${n}\n${u}\n`;
    });
    document.getElementById('output').value=out;
}

function m3uToTxt(){
    const input=document.getElementById('inputContent').value.trim();
    if(!input)return;
    let out="",g="";
    const l=input.split('\n');
    for(let i=0;i<l.length;i++){
        if(l[i].startsWith('#EXTINF')){
            const n=l[i].split(',').pop();
            const gm=l[i].match(/group-title="([^"]+)"/);
            const ng=gm?gm[1]:"默认";
            if(ng!==g){out+=`${ng},#genre#\n`;g=ng;}
            out+=`${cleanNameFn(n)},${l[i+1]}\n`;
            i++;
        }
    }
    document.getElementById('output').value=out;
}

function clearAll(){
    inputContent.value='';
    output.value='';
    subLinkOutput.value='';
}

function copyResult(){
    navigator.clipboard.writeText(output.value);
    alert("已复制");
}

function downloadResult(){
    const b=new Blob([output.value]);
    const a=document.createElement('a');
    a.href=URL.createObjectURL(b);
    a.download="iptv.m3u";
    a.click();
}

function generateSubLink(){
    const c=output.value.trim();
    if(!c)return alert("先生成 M3U");
    const b=btoa(unescape(encodeURIComponent(c)));
    const u=`${location.origin}${location.pathname}?sub=${b}`;
    subLinkOutput.value=u;
    alert("订阅链接已生成");
}
</script>

</body>
</html>
