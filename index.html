<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="format-detection" content="telephone=no">
    <title>IPTV工具集 - LOGO模糊搜索</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", Arial, sans-serif;
        }
        body {
            background: #f5f5f5;
            padding: 15px;
            max-width: 100%;
            margin: 0 auto;
        }
        .container {
            background: #fff;
            padding: 20px 15px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,.08);
        }
        h1 {
            font-size: 18px;
            text-align: center;
            margin-bottom: 20px;
            color: #333;
            font-weight: 600;
        }
        /* LOGO模糊搜索模块 */
        .logo-search {
            margin-bottom: 20px;
            padding-bottom: 20px;
            border-bottom: 1px solid #eee;
        }
        .logo-search h3 {
            font-size: 16px;
            margin-bottom: 10px;
            color: #333;
            font-weight: 500;
        }
        .search-bar {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
            width: 100%;
        }
        .search-bar input {
            flex: 1;
            padding: 12px 16px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
        }
        .search-bar button {
            padding: 0 20px;
            background: #1677ff;
            color: #fff;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            white-space: nowrap;
        }
        .loading {
            text-align: center;
            color: #1677ff;
            font-size: 14px;
            padding: 20px;
            display: none;
        }
        .logo-result {
            max-height: 300px;
            overflow-y: auto;
            border: 1px solid #eee;
            border-radius: 8px;
            padding: 10px;
            display: none;
        }
        .logo-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px;
            border-bottom: 1px solid #f5f5f5;
            cursor: pointer;
        }
        .logo-item:last-child {
            border-bottom: none;
        }
        .logo-item:hover {
            background: #e8f4ff;
        }
        .logo-item .preview {
            width: 60px;
            height: 30px;
            border: 1px solid #eee;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            cursor: zoom-in;
        }
        .logo-item .preview img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            transition: transform 0.2s;
        }
        .logo-item .preview img:hover {
            transform: scale(1.05);
        }
        .logo-item .preview .placeholder {
            color: #999;
            font-size: 10px;
        }
        .logo-item .info {
            flex: 1;
        }
        .logo-item .name {
            font-size: 14px;
            color: #333;
            margin-bottom: 4px;
        }
        .logo-item .url {
            font-size: 12px;
            color: #666;
            word-break: break-all;
        }
        .logo-item .copy-btn {
            padding: 4px 12px;
            font-size: 12px;
            background: #1677ff;
            color: #fff;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            white-space: nowrap;
        }
        /* 输入项样式 - 移动端适配 */
        .input-item {
            margin-bottom: 15px;
            width: 100%;
        }
        .input-item label {
            font-size: 14px;
            color: #555;
            display: block;
            margin-bottom: 6px;
            font-weight: 500;
        }
        input, textarea {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid #ddd;
            border-radius: 8px;
            background: #fafafa;
            font-size: 14px;
        }
        textarea {
            min-height: 180px;
            resize: vertical;
            line-height: 1.5;
        }
        .checkbox-item {
            display: flex;
            align-items: center;
            margin: 10px 0;
            font-size: 14px;
            color: #555;
        }
        .checkbox-item input {
            margin-right: 8px;
            width: 18px;
            height: 18px;
        }
        .btn-group {
            display: flex;
            gap: 8px;
            margin: 15px 0;
            flex-wrap: wrap;
            width: 100%;
        }
        button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background: #1677ff;
            color: #fff;
            cursor: pointer;
            font-size: 14px;
        }
        button.gray {
            background: #666;
        }
        .func-btn {
            display: flex;
            gap: 8px;
            margin: 15px 0;
            flex-wrap: wrap;
            width: 100%;
        }
        .upload {
            margin: 15px 0;
            width: 100%;
        }
        .upload input {
            border: none;
            padding: 0;
            background: transparent;
        }
        /* 安卓下载提示 */
        .download-tip {
            font-size: 12px;
            color: #666;
            text-align: center;
            margin-top: 10px;
            line-height: 1.4;
        }
        /* 自定义净化关键词样式 */
        .custom-clean-tip {
            font-size: 12px;
            color: #999;
            margin-top: 4px;
        }
        /* LOGO放大预览弹窗 */
        .logo-preview-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            padding: 20px;
        }
        .logo-preview-content {
            max-width: 90%;
            max-height: 80%;
            position: relative;
        }
        .logo-preview-img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            border-radius: 8px;
        }
        .logo-preview-close {
            position: absolute;
            top: -15px;
            right: -15px;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background: #ff4d4f;
            color: #fff;
            border: none;
            font-size: 16px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>IPTV工具集 - LOGO模糊搜索</h1>

        <!-- LOGO模糊搜索模块 -->
        <div class="logo-search">
            <h3>频道LOGO模糊搜索</h3>
            <div class="search-bar">
                <input type="text" id="searchKey" placeholder="输入关键词（如CCTV、4K、BBC）">
                <button onclick="fuzzySearchLogo()">模糊搜索</button>
            </div>
            <div class="loading" id="loading">正在拉取LOGO列表...</div>
            <div id="logoResult" class="logo-result"></div>
        </div>

        <!-- 新增：繁体转简体开关 -->
        <div class="checkbox-item">
            <input type="checkbox" id="enableC2S" checked>
            <label>自动将繁体中文转换为简体中文（含上传文件）</label>
        </div>

        <div class="input-item">
            <label>EPG 地址</label>
            <input id="epgUrl" placeholder="请输入EPG地址" value="https://ie.erw.cc/all.xml.gz">
        </div>

        <!-- Logo基础地址 -->
        <div class="input-item">
            <label>Logo 基础地址（结尾 /）</label>
            <input id="logoUrlInput" placeholder="请输入Logo基础地址" value="https://cdn.jsdelivr.net/gh/1996TV/LOGO@main/">
        </div>

        <!-- 自定义净化关键词输入框 -->
        <div class="input-item">
            <label>自定义净化关键词</label>
            <input id="customCleanKeywords" placeholder="多个关键词用英文逗号分隔，如:测试,备用,无效">
            <div class="custom-clean-tip">提示：输入后会和默认关键词（高清|HD|超清）一起过滤频道名</div>
        </div>

        <div class="checkbox-item">
            <input type="checkbox" id="cleanName" checked>
            <label>净化频道名</label>
        </div>
        <div class="checkbox-item">
            <input type="checkbox" id="removeReplay" checked>
            <label>去除回看 / 回放 / 时移频道</label>
        </div>
        <div class="input-item">
            <label>旧链接前缀</label>
            <input id="oldLinkPrefix" placeholder="如http://old.com/">
        </div>
        <div class="input-item">
            <label>新链接前缀</label>
            <input id="newLinkPrefix" placeholder="如http://new.com/">
        </div>
        <div class="checkbox-item">
            <input type="checkbox" id="enableLinkReplace" checked>
            <label>启用链接替换</label>
        </div>
        <div class="upload">
            <input type="file" id="fileInput" accept=".txt,.m3u,.m3u8" onchange="readFile(this)">
        </div>
        <textarea id="inputContent" placeholder="粘贴或上传 TXT / M3U 内容"></textarea>
        
        <div class="btn-group">
            <button onclick="txtToM3u()">TXT → M3U</button>
            <button onclick="m3uToTxt()">M3U → TXT</button>
            <button onclick="onlyReplaceLink()">只替换链接</button>
            <button onclick="clearAll()">清空内容</button>
        </div>

        <div class="func-btn">
            <button onclick="downloadResult()">下载结果</button>
            <button onclick="copyResult()">复制结果</button>
        </div>
        <div class="download-tip">安卓手机请开启浏览器存储权限，下载后在通知栏查看</div>

        <textarea id="output" placeholder="处理结果" readonly></textarea>
    </div>

    <!-- LOGO放大预览弹窗 -->
    <div class="logo-preview-modal" id="logoPreviewModal" onclick="closeLogoPreview()">
        <div class="logo-preview-content" onclick="event.stopPropagation()">
            <img src="" alt="LOGO预览" class="logo-preview-img" id="previewImg">
            <button class="logo-preview-close" onclick="closeLogoPreview()">×</button>
        </div>
    </div>

    <script>
        // 仓库配置
        const repoOwner = "1996TV";
        const repoName = "LOGO";
        const cdnBase = `https://cdn.jsdelivr.net/gh/${repoOwner}/${repoName}@main/`;
        let allLogoFiles = [];
        let logoNameMap = {}; // 存储LOGO名称（小写）→ 原文件名的映射

        // 常量配置
        const DEFAULT_EPG_URL = "https://ie.erw.cc/all.xml.gz";
        const DEFAULT_LOGO_URL = "https://cdn.jsdelivr.net/gh/1996TV/LOGO@main/";
        const DEFAULT_CLEAN_KEYWORDS = ["高清", "HD", "超清"];
        const CONFIG_STORAGE_KEY = "iptv_tool_config";

        // ========== 新增：繁体转简体映射表 ==========
        const 繁简映射表 = {
            "愛":"爱","灣":"湾","顯":"显","數":"数","據":"据","檔":"档","構":"构","過":"过","與":"与","將":"将",
            "進":"进","發":"发","電":"电","視":"视","頻":"频","節":"节","臺":"台","戲":"戏","學":"学","會":"会",
            "員":"员","備":"备","設":"设","開":"开","關":"关","機":"机","類":"类","組":"组","圖":"图","標":"标",
            "題":"题","認":"认","識":"识","産":"产","業":"业","選":"选","擇":"择","獲":"获","資":"资","訊":"讯",
            "處":"处","管":"管","運":"运","狀":"状","態":"态","係":"系","統":"统","動":"动","畫":"画","兒":"儿",
            "萬":"万","億":"亿","餘":"余","復":"复","雜":"杂","層":"层","體":"体","總":"总","線":"线","號":"号",
            "價":"价","響":"响","應":"应","強":"强","優":"优","質":"质","錄":"录","播":"播","影":"影","娛":"娱",
            "樂":"乐","育":"育","新":"新","聞":"闻","財":"财","經":"经","藝":"艺","漫":"漫","教":"教","少":"少",
            "英":"英","語":"语","國":"国","際":"际","衛":"卫","福":"福","利":"利","公":"公","共":"共","道":"道",
            "星":"星","有":"有","碼":"码","高":"高","清":"清","超":"超","級":"级","質":"质","立":"立","3":"3",
            "D":"D","藍":"蓝","光":"光","原":"原","聲":"声","環":"环","繞":"绕","左":"左","右":"右","雙":"双",
            "多":"多","音":"音","軌":"轨","中":"中","文":"文","粵":"粤","台":"台","日":"日","韓":"韩","法":"法",
            "德":"德","俄":"俄","西":"西","班":"班","牙":"牙","葡":"葡","萄":"萄","阿":"阿","拉":"拉","伯":"伯",
            "印":"印","度":"度","泰":"泰","越":"越","南":"南","馬":"马","來":"来","亞":"亚","菲":"菲","律":"律",
            "賓":"宾","印尼":"印尼","麥":"麦","哲":"哲","倫":"伦","偵":"侦","查":"查","紀":"纪","實":"实"
        };

        // 新增：繁体转简体核心函数
        function traditionalToSimplified(str) {
            if (!str || typeof str !== "string") return str;
            let result = "";
            for (let i = 0; i < str.length; i++) {
                result += 繁简映射表[str[i]] || str[i];
            }
            return result;
        }

        // ========== 新增：LOGO名称映射表加载 ==========
        async function loadLogoNameMap() {
            try {
                if (allLogoFiles.length === 0) {
                    await fetchLogoFiles();
                }
                // 建立LOGO名称（小写）→ 原文件名的映射
                logoNameMap = {};
                allLogoFiles.forEach(file => {
                    const logoName = file.name.replace('.png', '');
                    const normalizedName = logoName.toLowerCase().replace(/\s+/g, '').replace(/[^\w]/g, '');
                    logoNameMap[normalizedName] = file.name;
                });
            } catch (error) {
                console.error('加载LOGO名称映射失败', error);
            }
        }

        // 页面加载初始化 - 核心修改：不加载本地配置，刷新不保留记录
        window.onload = async function() {
            // 1. 清除localStorage中的配置，刷新后不再保留
            localStorage.removeItem(CONFIG_STORAGE_KEY);
            // 2. 替换当前历史记录，避免后退到旧状态
            history.replaceState(null, null, window.location.href);
            // 3. 预加载LOGO映射表
            await loadLogoNameMap();
            // 4. 强制设置默认地址，不读取缓存
            document.getElementById('epgUrl').value = DEFAULT_EPG_URL;
            document.getElementById('logoUrlInput').value = DEFAULT_LOGO_URL;
            // 5. 清除所有输入框和文本域内容
            document.getElementById('searchKey').value = '';
            document.getElementById('customCleanKeywords').value = '';
            document.getElementById('oldLinkPrefix').value = '';
            document.getElementById('newLinkPrefix').value = '';
            document.getElementById('inputContent').value = '';
            document.getElementById('output').value = '';
            // 6. 重置复选框为默认状态
            document.getElementById('enableC2S').checked = true;
            document.getElementById('cleanName').checked = true;
            document.getElementById('removeReplay').checked = true;
            document.getElementById('enableLinkReplace').checked = true;
        }

        // ========== 修改：配置存储功能 - 完全禁用localStorage，刷新不保留记录 ==========
        // 保存配置：改为空函数，不存储任何数据
        function saveConfig() {
            // 不执行任何存储操作，刷新后不保留记录
            return;
        }

        // 加载配置：改为空函数，不读取任何数据
        function loadConfig() {
            // 不执行任何读取操作，刷新后不保留记录
            return;
        }

        // ========== LOGO放大预览功能 ==========
        function openLogoPreview(imgUrl) {
            const modal = document.getElementById('logoPreviewModal');
            const previewImg = document.getElementById('previewImg');
            previewImg.src = imgUrl;
            modal.style.display = 'flex';
        }

        function closeLogoPreview() {
            const modal = document.getElementById('logoPreviewModal');
            modal.style.display = 'none';
        }

        // LOGO模糊搜索
        async function fuzzySearchLogo() {
            const key = document.getElementById('searchKey').value.trim().toLowerCase();
            if (!key) {
                alert('请输入关键词！');
                return;
            }

            const loading = document.getElementById('loading');
            const resultBox = document.getElementById('logoResult');
            
            loading.style.display = 'block';
            resultBox.style.display = 'none';

            try {
                if (allLogoFiles.length === 0) {
                    await fetchLogoFiles();
                }

                const matchFiles = allLogoFiles.filter(file => 
                    file.name.toLowerCase().includes(key)
                );

                loading.style.display = 'none';
                resultBox.style.display = 'block';
                
                if (matchFiles.length === 0) {
                    resultBox.innerHTML = '<p style="text-align:center; color:#999; padding:20px;">未找到匹配的LOGO文件</p>';
                    return;
                }

                let resultHtml = '';
                matchFiles.forEach(file => {
                    const logoName = file.name.replace('.png', '');
                    const logoCdnUrl = cdnBase + file.name;
                    resultHtml += `
                        <div class="logo-item">
                            <div class="preview" onclick="openLogoPreview('${logoCdnUrl}')">
                                <img src="${logoCdnUrl}" alt="${logoName}" onerror="this.parentNode.innerHTML='<span class=placeholder>加载失败</span>'">
                            </div>
                            <div class="info">
                                <div class="name">${logoName}</div>
                                <div class="url">${logoCdnUrl}</div>
                            </div>
                            <button class="copy-btn" onclick="copyLogoUrl('${logoCdnUrl}')">复制</button>
                        </div>
                    `;
                });
                resultBox.innerHTML = resultHtml;

            } catch (error) {
                loading.style.display = 'none';
                resultBox.style.display = 'block';
                resultBox.innerHTML = `<p style="text-align:center; color:#f5222d; padding:20px;">搜索失败：${error.message}</p>`;
                console.error('LOGO搜索失败', error);
            }
        }

        async function fetchLogoFiles() {
            const apiUrl = `https://api.github.com/repos/${repoOwner}/${repoName}/contents/`;
            const response = await fetch(apiUrl);
            
            if (!response.ok) {
                throw new Error(`GitHub API请求失败（${response.status}）`);
            }

            const files = await response.json();
            allLogoFiles = files
                .filter(file => file.type === 'file' && file.name.endsWith('.png'))
                .map(file => ({ name: file.name, downloadUrl: file.download_url }));
        }

        function copyLogoUrl(url) {
            navigator.clipboard.writeText(url)
                .then(() => alert('LOGO链接复制成功！'))
                .catch(() => {
                    const textarea = document.createElement('textarea');
                    textarea.value = url;
                    document.body.appendChild(textarea);
                    textarea.select();
                    document.execCommand('copy');
                    document.body.removeChild(textarea);
                    alert('LOGO链接复制成功！');
                });
        }

        // 文件上传函数 - 新增繁体转简体处理
        function readFile(input) {
            const file = input.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = e => {
                let content = e.target.result;
                // 新增：繁转简处理
                if (document.getElementById('enableC2S').checked) {
                    content = traditionalToSimplified(content);
                }
                document.getElementById('inputContent').value = content;
            };
            // 强制UTF-8编码读取
            reader.readAsText(file, 'utf-8');
        }

        // LOGO名称不分大小写匹配核心函数
        function getMatchedLogoUrl(channelName) {
            const logoBase = document.getElementById('logoUrlInput').value.replace(/\/$/, '') + '/';
            // 标准化频道名：繁转简 → 小写 → 去空格和特殊字符
            let normalizedChannel = traditionalToSimplified(channelName);
            normalizedChannel = normalizedChannel.toLowerCase().replace(/\s+/g, '').replace(/[^\w]/g, '');

            // 1. 精确匹配
            if (logoNameMap[normalizedChannel]) {
                return logoBase + logoNameMap[normalizedChannel];
            }

            // 2. 模糊匹配
            const matchedKey = Object.keys(logoNameMap).find(logoKey => {
                return logoKey.includes(normalizedChannel) || normalizedChannel.includes(logoKey);
            });
            if (matchedKey) {
                return logoBase + logoNameMap[matchedKey];
            }

            // 3. 无匹配时返回默认LOGO地址
            return logoBase + 'default.png';
        }

        // 安卓下载优化
        function downloadResult() {
            const content = document.getElementById('output').value.trim();
            if (!content) return alert('暂无内容可下载！');
            const ext = content.startsWith('#EXTM3U') ? 'm3u' : 'txt';
            const fileName = `iptv.${ext}`;

            try {
                const blob = new Blob([content], { type: 'application/octet-stream' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = fileName;
                a.target = '_self';
                document.body.appendChild(a);
                const event = new MouseEvent('click', {
                    bubbles: true,
                    cancelable: true,
                    view: window
                });
                a.dispatchEvent(event);
                setTimeout(() => {
                    document.body.removeChild(a);
                    URL.revokeObjectURL(url);
                    alert(`✅ 下载已触发\n文件：${fileName}\n请在通知栏或Download文件夹查看`);
                }, 1000);
            } catch (e1) {
                console.error('Blob方案失败，尝试降级方案', e1);
                try {
                    const dataUri = `data:application/octet-stream;charset=utf-8,${encodeURIComponent(content)}`;
                    const a = document.createElement('a');
                    a.href = dataUri;
                    a.download = fileName;
                    document.body.appendChild(a);
                    a.click();
                    setTimeout(() => {
                        document.body.removeChild(a);
                        alert(`✅ 降级方案下载成功\n文件：${fileName}\n请在通知栏查看`);
                    }, 500);
                } catch (e2) {
                    console.error('降级方案也失败', e2);
                    alert(`⚠️ 自动下载失败\n请点击【复制结果】按钮，手动粘贴到记事本并保存为 ${fileName}`);
                }
            }
        }

        function copyResult() {
            const content = document.getElementById('output').value.trim();
            if (!content) return alert('暂无内容可复制！');
            navigator.clipboard.writeText(content)
                .then(() => alert('结果复制成功！可粘贴到记事本保存'))
                .catch(() => {
                    const ta = document.createElement('textarea');
                    ta.value = content;
                    document.body.appendChild(ta);
                    ta.select();
                    document.execCommand('copy');
                    document.body.removeChild(ta);
                    alert('结果复制成功！');
                });
        }

        // 净化频道名函数 - 新增繁转简处理
        function cleanNameFn(n) {
            // 新增：先繁转简
            if (document.getElementById('enableC2S').checked) {
                n = traditionalToSimplified(n);
            }
            if (!document.getElementById('cleanName').checked) return n;
            
            let customKeywords = document.getElementById('customCleanKeywords').value.split(',').map(k => k.trim()).filter(k => k);
            let allKeywords = [...DEFAULT_CLEAN_KEYWORDS, ...customKeywords];
            
            let cleanedName = n;
            allKeywords.forEach(keyword => {
                cleanedName = cleanedName.replace(keyword, '');
            });
            return cleanedName.trim();
        }

        function isReplay(n) {
            return /(回看|回放|时移|Replay|Catchup|重播)/i.test(n);
        }

        // 核心优化：TXT转M3U函数 - 改用LOGO不分大小写匹配
        function txtToM3u() {
            const epg = document.getElementById('epgUrl').value.trim();
            const input = document.getElementById('inputContent').value.trim();
            if (!input) return alert('请输入TXT内容！');
            
            const lines = input.split('\n');
            let output = `#EXTM3U x-tvg-url="${epg}"\n`;
            let group = '';

            lines.forEach(l => {
                l = l.trim();
                if (!l) return;
                if (l.endsWith(',#genre#')) {
                    group = l.replace(',#genre#', '');
                    // 新增：分组名繁转简
                    if (document.getElementById('enableC2S').checked) {
                        group = traditionalToSimplified(group);
                    }
                    return;
                }
                if (!l.includes(',')) return;

                const [name, url] = l.split(',');
                if (document.getElementById('removeReplay').checked && isReplay(name)) return;
                
                const cleanName = cleanNameFn(name);
                // 核心修改：改用不分大小写的LOGO匹配函数
                const logoUrl = getMatchedLogoUrl(cleanName);
                let playUrl = url;
                if (document.getElementById('enableLinkReplace').checked) {
                    const oldPrefix = document.getElementById('oldLinkPrefix').value.trim();
                    const newPrefix = document.getElementById('newLinkPrefix').value.trim();
                    if (oldPrefix && newPrefix) playUrl = playUrl.replace(oldPrefix, newPrefix);
                }

                output += `#EXTINF:-1 tvg-name="${cleanName}" tvg-logo="${logoUrl}" group-title="${group}",${cleanName}\n${playUrl}\n`;
            });

            document.getElementById('output').value = output;
        }

        function m3uToTxt() {
            const input = document.getElementById('inputContent').value.trim();
            if (!input) return alert('请输入M3U内容！');
            
            const lines = input.split('\n');
            let output = '';
            let currentGroup = '';

            for (let i = 0; i < lines.length; i++) {
                const line = lines[i].trim();
                if (line.startsWith('#EXTINF')) {
                    const nameMatch = line.match(/,(.*)$/);
                    const groupMatch = line.match(/group-title="([^"]+)"/);
                    const name = nameMatch ? nameMatch[1].trim() : '';
                    const group = groupMatch ? groupMatch[1] : '默认分类';

                    if (document.getElementById('removeReplay').checked && isReplay(name)) {
                        i++;
                        continue;
                    }

                    // 新增：分组名和频道名繁转简
                    let simplifiedGroup = group;
                    let simplifiedName = name;
                    if (document.getElementById('enableC2S').checked) {
                        simplifiedGroup = traditionalToSimplified(simplifiedGroup);
                        simplifiedName = traditionalToSimplified(simplifiedName);
                    }

                    if (simplifiedGroup !== currentGroup) {
                        output += `${simplifiedGroup},#genre#\n`;
                        currentGroup = simplifiedGroup;
                    }

                    let url = lines[i + 1] ? lines[i + 1].trim() : '';
                    if (document.getElementById('enableLinkReplace').checked) {
                        const oldPrefix = document.getElementById('oldLinkPrefix').value.trim();
                        const newPrefix = document.getElementById('newLinkPrefix').value.trim();
                        if (oldPrefix && newPrefix) url = url.replace(oldPrefix, newPrefix);
                    }

                    const cleanName = cleanNameFn(simplifiedName);
                    output += `${cleanName},${url}\n`;
                    i++;
                }
            }

            document.getElementById('output').value = output;
        }

        function onlyReplaceLink() {
            const input = document.getElementById('inputContent').value.trim();
            if (!input) return alert('请输入内容！');
            const oldPrefix = document.getElementById('oldLinkPrefix').value.trim();
            const newPrefix = document.getElementById('newLinkPrefix').value.trim();
            if (!oldPrefix || !newPrefix) return alert('请填写完整的新旧链接前缀！');
            
            let output = input.replace(new RegExp(oldPrefix, 'g'), newPrefix);
            // 新增：繁转简处理
            if (document.getElementById('enableC2S').checked) {
                output = traditionalToSimplified(output);
            }
            document.getElementById('output').value = output;
        }

        function clearAll() {
            document.getElementById('inputContent').value = '';
            document.getElementById('output').value = '';
        }
    </script>
</body>
