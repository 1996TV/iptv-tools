<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TXT ⇌ M3U 转换工具</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Arial", sans-serif;
        }
        body {
            background-color: #f5f5f5;
            padding: 20px 15px;
        }
        h1 {
            text-align: center;
            font-size: 18px;
            color: #333;
            margin-bottom: 20px;
            font-weight: 600;
        }
        .tool-container {
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.1);
        }
        .input-row {
            margin-bottom: 12px;
        }
        .input-row label {
            display: block;
            font-size: 14px;
            color: #666;
            margin-bottom: 4px;
        }
        .input-row input {
            width: 100%;
            padding: 8px 10px;
            border: 1px solid #e0e0e0;
            border-radius: 4px;
            font-size: 13px;
        }
        .checkbox-row {
            margin: 15px 0;
        }
        .checkbox-item {
            display: flex;
            align-items: flex-start;
            margin-bottom: 8px;
            font-size: 13px;
            color: #666;
        }
        .checkbox-item input {
            margin-top: 2px;
            margin-right: 6px;
            width: 14px;
            height: 14px;
        }
        /* 上传区域样式 */
        .upload-wrap {
            margin: 10px 0 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .upload-btn {
            padding: 8px 15px;
            background: #1677ff;
            color: #fff;
            border: none;
            border-radius: 4px;
            font-size: 14px;
            cursor: pointer;
        }
        #fileInput {
            display: none;
        }
        .file-tip {
            font-size: 13px;
            color: #999;
            flex: 1;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #e0e0e0;
            border-radius: 4px;
            font-size: 13px;
            min-height: 200px;
            resize: none;
            margin-bottom: 15px;
            line-height: 1.4;
        }
        .btn-wrap {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }
        .btn-wrap button {
            padding: 8px 16px;
            background: #1677ff;
            color: #fff;
            border: none;
            border-radius: 4px;
            font-size: 14px;
            cursor: pointer;
            flex: 1;
            min-width: 70px;
        }
        .btn-wrap button:hover {
            background: #0962d8;
        }
        #output {
            min-height: 200px;
        }
        /* 下载格式选择 */
        .download-select {
            margin-bottom: 15px;
        }
        .download-select select {
            width: 100%;
            padding: 8px 10px;
            border: 1px solid #e0e0e0;
            border-radius: 4px;
            font-size: 13px;
            color: #666;
        }
    </style>
</head>
<body>
    <h1>TXT ⇌ M3U 转换工具</h1>
    <div class="tool-container">
        <!-- EPG地址 -->
        <div class="input-row">
            <label>EPG 地址 (TXT → M3U):</label>
            <input type="text" id="epgUrl" value="https://ie.erw.cc/all.xml.gz" placeholder="输入EPG地址">
        </div>

        <!-- Logo地址 -->
        <div class="input-row">
            <label>基础 Logo 地址:</label>
            <input type="text" id="logoUrl" value="https://cdn.jsdelivr.net/gh/1996TV/LOGO1@main/icon/" placeholder="输入Logo基础地址">
        </div>

        <!-- 复选框选项 -->
        <div class="checkbox-row">
            <div class="checkbox-item">
                <input type="checkbox" id="cleanName">
                <label for="cleanName">TXT转M3U时，对频道名进行净化（EXTINF显示名）</label>
            </div>
            <div class="checkbox-item">
                <input type="checkbox" id="priorityName">
                <label for="priorityName">M3U8转TXT时，优先使用 tvg-name / tvg-id作为频道名称（默认使用EXTINF显示名）</label>
            </div>
            <div class="checkbox-item">
                <input type="checkbox" id="reGroup">
                <label for="reGroup">重新分组 (忽略原有分组，按规则分组)</label>
            </div>
        </div>

        <!-- 文件上传 -->
        <div class="upload-wrap">
            <label for="fileInput" class="upload-btn">上传文件</label>
            <input type="file" id="fileInput" accept=".txt,.m3u,.m3u8">
            <span class="file-tip" id="fileTip">未选择文件（支持txt/m3u/m3u8）</span>
        </div>

        <!-- 输入文本域 -->
        <textarea id="inputContent" placeholder="在此粘贴 TXT 或 M3U 列表..."></textarea>

        <!-- 功能按钮 -->
        <div class="btn-wrap">
            <button onclick="txtToM3u()">TXT → M3U</button>
            <button onclick="m3uToTxt()">M3U → TXT</button>
            <button onclick="doReGroup()">一键重新分组</button>
            <button onclick="clearContent()">清空内容</button>
            <button onclick="copyResult()">复制结果</button>
        </div>

        <!-- 下载格式选择 -->
        <div class="download-select">
            <select id="downloadFormat">
                <option value="m3u">下载为 .m3u 格式</option>
                <option value="txt">下载为 .txt 格式</option>
            </select>
        </div>

        <!-- 下载按钮 -->
        <div class="btn-wrap">
            <button onclick="downloadResult()">下载转换结果</button>
        </div>

        <!-- 输出文本域 -->
        <textarea id="output" placeholder="转换结果将在这里显示..." readonly></textarea>
    </div>

    <script>
        // 元素获取
        const epgUrl = document.getElementById('epgUrl');
        const logoUrl = document.getElementById('logoUrl');
        const cleanName = document.getElementById('cleanName');
        const priorityName = document.getElementById('priorityName');
        const reGroup = document.getElementById('reGroup');
        const inputContent = document.getElementById('inputContent');
        const output = document.getElementById('output');
        const fileInput = document.getElementById('fileInput');
        const fileTip = document.getElementById('fileTip');
        const downloadFormat = document.getElementById('downloadFormat');

        // 监听文件上传
        fileInput.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) {
                fileTip.textContent = '未选择文件（支持txt/m3u/m3u8）';
                return;
            }
            fileTip.textContent = `已选择：${file.name}`;
            const reader = new FileReader();
            reader.onload = function(event) {
                inputContent.value = event.target.result;
            };
            reader.readAsText(file, 'utf-8');
        });

        // 频道名净化
        function formatName(name) {
            if (!cleanName.checked) return name;
            return name.replace(/\s+/g, '')
                       .replace(/[高清HD超清频道]/g, '')
                       .replace(/[^a-zA-Z0-9\u4e00-\u9fa5]/g, '');
        }

        // 提取分组名称
        function getGroupName(url) {
            if (url.includes('4gtv')) return '4GTV 综合';
            // 可根据需求扩展其他分组规则
            return '默认分组';
        }

        // TXT转M3U（还原截图格式）
        function txtToM3u() {
            const epg = epgUrl.value.trim();
            const logoBase = logoUrl.value.trim();
            const input = inputContent.value.trim();

            if (!input) {
                alert('请输入或上传转换内容');
                return;
            }

            let lines = input.split('\n').filter(line => line.trim() !== '');
            let m3uStr = `#EXTM3U x-tvg-url="${epg}"\n`;

            lines.forEach(line => {
                if (!line.includes(',')) return;
                const [name, url] = line.split(',');
                if (!url) return;

                const fmtName = formatName(name);
                const groupTitle = getGroupName(url);
                const logo = logoBase ? `${logoBase}${fmtName}.png` : '';

                m3uStr += `#EXTINF:-1 tvg-id="${fmtName}" tvg-name="${fmtName}" tvg-logo="${logo}" group-title="${groupTitle}",${fmtName}\n`;
                m3uStr += `${url.trim()}\n`;
            });

            output.value = reGroup.checked ? sortGroup(m3uStr) : m3uStr;
        }

        // M3U转TXT（还原截图格式）
        function m3uToTxt() {
            const input = inputContent.value.trim();
            if (!input) {
                alert('请输入或上传转换内容');
                return;
            }

            let lines = input.split('\n').filter(line => line.trim() !== '');
            let txtStr = '';
            let currentName = '';
            let currentGroup = '';

            lines.forEach((line, index) => {
                if (line.startsWith('#EXTINF')) {
                    // 提取分组
                    const groupMatch = line.match(/group-title="([^"]+)"/);
                    currentGroup = groupMatch ? groupMatch[1] : '';
                    // 提取名称
                    if (priorityName.checked) {
                        const tvgNameMatch = line.match(/tvg-name="([^"]+)"/);
                        const tvgIdMatch = line.match(/tvg-id="([^"]+)"/);
                        currentName = tvgNameMatch ? tvgNameMatch[1] : (tvgIdMatch ? tvgIdMatch[1] : '');
                    }
                    if (!currentName) {
                        currentName = line.split(',').pop() || '';
                    }
                } else if (line.startsWith('http')) {
                    if (currentGroup) txtStr += `${currentGroup},#genre#\n`;
                    txtStr += `${currentName},${line.trim()}\n`;
                    currentName = '';
                    currentGroup = '';
                }
            });

            output.value = reGroup.checked ? sortGroup(txtStr) : txtStr;
        }

        // 重新分组排序
        function sortGroup(content) {
            let lines = content.split('\n').filter(line => line.trim() !== '');
            return lines.sort((a, b) => a.localeCompare(b, 'zh-CN')).join('\n');
        }

        // 一键重新分组
        function doReGroup() {
            const content = output.value.trim() || inputContent.value.trim();
            if (!content) {
                alert('暂无内容可分组');
                return;
            }
            output.value = sortGroup(content);
        }

        // 清空内容
        function clearContent() {
            inputContent.value = '';
            output.value = '';
            fileTip.textContent = '未选择文件（支持txt/m3u/m3u8）';
            fileInput.value = '';
        }

        // 复制结果
        function copyResult() {
            const content = output.value.trim();
            if (!content) {
                alert('暂无结果可复制');
                return;
            }
            navigator.clipboard.writeText(content).then(() => {
                alert('复制成功');
            }).catch(() => {
                output.select();
                document.execCommand('copy');
                alert('复制成功');
            });
        }

        // 下载结果
        function downloadResult() {
            const content = output.value.trim();
            const format = downloadFormat.value;
            const fileName = `iptv-converted.${format}`;

            if (!content) {
                alert('暂无结果可下载');
                return;
            }

            const blob = new Blob([content], { type: 'text/plain' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = fileName;
            a.click();
            URL.revokeObjectURL(url);
        }
    </script>
</body>
</html>
