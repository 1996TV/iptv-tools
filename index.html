<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="format-detection" content="telephone=no">
    <title>IPTV工具集 - 分面板版</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", Arial, sans-serif;
        }
        body {
            background: #f5f5f5;
            padding: 15px;
            max-width: 100%;
            margin: 0 auto;
        }
        .tab-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            width: 100%;
        }
        .tab-btn {
            flex: 1;
            padding: 12px 0;
            border: none;
            border-radius: 8px;
            background: #e5e5e5;
            color: #333;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s;
        }
        .tab-btn.active {
            background: #1677ff;
            color: #fff;
        }
        .panel-container {
            width: 100%;
        }
        .panel {
            display: none;
            background: #fff;
            padding: 20px 15px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,.08);
        }
        .panel.active {
            display: block;
        }
        h1 {
            font-size: 18px;
            text-align: center;
            margin-bottom: 20px;
            color: #333;
            font-weight: 600;
        }
        .logo-search {
            margin-bottom: 20px;
            padding-bottom: 20px;
            border-bottom: 1px solid #eee;
        }
        .logo-search h3 {
            font-size: 16px;
            margin-bottom: 10px;
            color: #333;
            font-weight: 500;
        }
        .search-bar {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
            width: 100%;
        }
        .search-bar input {
            flex: 1;
            padding: 12px 16px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
        }
        .search-bar button {
            padding: 0 20px;
            background: #1677ff;
            color: #fff;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            white-space: nowrap;
            box-shadow: 0 4px 0 #0f5ccc, 0 6px 8px rgba(0,0,0,0.15);
            position: relative;
            top: 0;
            transition: all 0.15s ease;
        }
        .search-bar button:active {
            top: 2px;
            box-shadow: 0 2px 0 #0f5ccc, 0 3px 4px rgba(0,0,0,0.1);
        }
        .loading {
            text-align: center;
            color: #1677ff;
            font-size: 14px;
            padding: 20px;
            display: none;
        }
        .logo-result {
            max-height: 300px;
            overflow-y: auto;
            border: 1px solid #eee;
            border-radius: 8px;
            padding: 10px;
            display: none;
        }
        .logo-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px;
            border-bottom: 1px solid #f5f5f5;
            cursor: pointer;
        }
        .logo-item:last-child {
            border-bottom: none;
        }
        .logo-item:hover {
            background: #e8f4ff;
        }
        .logo-item .preview {
            width: 60px;
            height: 30px;
            border: 1px solid #eee;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            cursor: zoom-in;
        }
        .logo-item .preview img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            transition: transform 0.2s;
        }
        .logo-item .preview img:hover {
            transform: scale(1.05);
        }
        .logo-item .preview .placeholder {
            color: #999;
            font-size: 10px;
        }
        .logo-item .info {
            flex: 1;
        }
        .logo-item .name {
            font-size: 14px;
            color: #333;
            margin-bottom: 4px;
        }
        .logo-item .url {
            font-size: 12px;
            color: #666;
            word-break: break-all;
        }
        .logo-item .copy-btn {
            padding: 4px 12px;
            font-size: 12px;
            color: #fff;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            white-space: nowrap;
            background: #1677ff;
            box-shadow: 0 3px 0 #0f5ccc, 0 4px 6px rgba(0,0,0,0.1);
            position: relative;
            top: 0;
            transition: all 0.15s ease;
        }
        .logo-item .copy-btn:active {
            top: 1px;
            box-shadow: 0 1px 0 #0f5ccc, 0 2px 3px rgba(0,0,0,0.1);
        }
        .input-item {
            margin-bottom: 15px;
            width: 100%;
        }
        .input-item label {
            font-size: 14px;
            color: #555;
            display: block;
            margin-bottom: 6px;
            font-weight: 500;
        }
        input, textarea {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid #ddd;
            border-radius: 8px;
            background: #fafafa;
            font-size: 14px;
        }
        textarea {
            min-height: 180px;
            resize: vertical;
            line-height: 1.5;
        }
        .checkbox-item {
            display: flex;
            align-items: center;
            margin: 10px 0;
            font-size: 14px;
            color: #555;
        }
        .checkbox-item input {
            margin-right: 8px;
            width: 18px;
            height: 18px;
        }
        .btn-group {
            display: flex;
            gap: 8px;
            margin: 15px 0;
            flex-wrap: wrap;
            width: 100%;
        }
        button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            color: #fff;
            cursor: pointer;
            font-size: 14px;
            position: relative;
            top: 0;
            transition: all 0.15s ease;
        }
        button.blue {
            background: #1677ff;
            box-shadow: 0 4px 0 #0f5ccc, 0 6px 8px rgba(0,0,0,0.15);
        }
        button.blue:active {
            top: 2px;
            box-shadow: 0 2px 0 #0f5ccc, 0 3px 4px rgba(0,0,0,0.1);
        }
        button.red {
            background: #ff4d4f;
            color: #fff;
            box-shadow: 0 4px 0 #d9363e, 0 6px 8px rgba(0,0,0,0.15);
        }
        button.red:active {
            top: 2px;
            box-shadow: 0 2px 0 #d9363e, 0 3px 4px rgba(0,0,0,0.1);
        }
        button.green {
            background: #52c41a;
            color: #fff;
            box-shadow: 0 4px 0 #389e0d, 0 6px 8px rgba(0,0,0,0.1);
        }
        button.green:active {
            top: 2px;
            box-shadow: 0 2px 0 #389e0d, 0 3px 4px rgba(0,0,0,0.1);
        }
        .func-btn {
            display: flex;
            gap: 8px;
            margin: 15px 0;
            flex-wrap: wrap;
            width: 100%;
        }
        .upload {
            margin: 15px 0;
            width: 100%;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .upload-input-label {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 120px;
            height: 40px;
            border-radius: 8px;
            background: #1677ff;
            color: #fff;
            font-size: 14px;
            cursor: pointer;
            box-shadow: 0 4px 0 #0f5ccc, 0 6px 8px rgba(0,0,0,0.15);
            position: relative;
            top: 0;
            transition: all 0.15s ease;
        }
        .upload-input-label:active {
            top: 2px;
            box-shadow: 0 2px 0 #0f5ccc, 0 3px 4px rgba(0,0,0,0.1);
        }
        .upload input {
            display: none;
        }
        .file-name-display {
            flex: 1;
            padding: 8px 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            background: #fafafa;
            font-size: 14px;
            color: #666;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .file-name-display:empty::before {
            content: "未选择文件";
            color: #999;
        }
        .download-tip {
            font-size: 12px;
            color: #666;
            text-align: center;
            margin-top: 10px;
            line-height: 1.4;
        }
        .custom-clean-tip {
            font-size: 12px;
            color: #999;
            margin-top: 4px;
        }
        .logo-preview-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            padding: 20px;
        }
        .logo-preview-content {
            max-width: 90%;
            max-height: 80%;
            position: relative;
            display: inline-block;
        }
        .logo-preview-img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            border-radius: 8px;
            display: block;
        }
        .logo-preview-close {
            position: absolute !important;
            top: -15px !important;
            right: -15px !important;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background: #ff4d4f;
            color: #fff;
            border: none;
            font-size: 16px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 3px 0 #d9363e, 0 4px 6px rgba(0,0,0,0.1);
            z-index: 10000 !important;
        }
        .sub-link-group {
            display: flex;
            gap: 10px;
            width: 100%;
        }
        .sub-link-group input {
            flex: 1;
        }
        .sub-link-group button {
            flex: none;
            width: 80px;
            padding: 12px 0;
        }
        .repo-config {
            display: none;
        }
        /* 隐藏仓库订阅地址容器（默认） */
        #repoSubLinkContainer {
            display: none;
        }
    </style>
</head>
<body>
    <div class="tab-group">
        <button class="tab-btn active" onclick="switchTab('iptv-panel')">IPTV文件转换</button>
        <button class="tab-btn" onclick="switchTab('logo-panel')">LOGO模糊搜索</button>
    </div>
    <div class="panel-container">
        <div class="panel" id="logo-panel">
            <h1>IPTV工具集 - LOGO模糊搜索</h1>
            <div class="logo-search">
                <h3>频道LOGO模糊搜索</h3>
                <div class="search-bar">
                    <input type="text" id="searchKey" placeholder="输入关键词（如CCTV、4K、BBC）">
                    <button class="blue" onclick="fuzzySearchLogo()">模糊搜索</button>
                </div>
                <div class="loading" id="loading">正在拉取LOGO列表...</div>
                <div id="logoResult" class="logo-result"></div>
            </div>
        </div>
        <div class="panel active" id="iptv-panel">
            <h1>IPTV工具集 - 文件转换</h1>

            <div class="repo-config">
                <input id="githubUser" value="1996TV">
                <input id="githubRepo" value="iptv-tools">
                <input id="githubToken" value="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">
                <input id="filePath" value="iptv-tools iptv.m3u">
            </div>

            <div class="input-item">
                <label>EPG 地址</label>
                <input id="epgUrl" value="https://epg.catvod.com/epg.xml">
            </div>
            <div class="input-item">
                <label>Logo 基础地址</label>
                <input id="logoUrlInput" value="https://cdn.jsdelivr.net/gh/1996TV/LOGO@main/">
            </div>
            <div class="input-item">
                <label>默认LOGO地址</label>
                <input id="fallbackLogoInput" value="https://cdn.jsdelivr.net/gh/1996TV/LOGO@main/mytvsuper.png">
            </div>
            <div class="input-item">
                <label>自定义净化关键词</label>
                <input id="customCleanKeywords" placeholder="多个关键词用英文逗号分隔">
                <div class="custom-clean-tip">提示：输入后会和默认关键词（高清|HD|超清）一起过滤频道名</div>
            </div>
            <div class="checkbox-item">
                <input type="checkbox" id="cleanName" checked>
                <label>净化频道名</label>
            </div>
            <div class="checkbox-item">
                <input type="checkbox" id="removeReplay" checked>
                <label>去除回看 / 回放 / 时移频道</label>
            </div>
            <div class="input-item">
                <label>旧链接前缀</label>
                <input id="oldLinkPrefix" placeholder="如http://old.com/">
            </div>
            <div class="input-item">
                <label>新链接前缀</label>
                <input id="newLinkPrefix" placeholder="如http://new.com/">
            </div>
            <div class="checkbox-item">
                <input type="checkbox" id="enableLinkReplace" checked>
                <label>启用链接替换</label>
            </div>
            <div class="upload">
                <label for="fileInput" class="upload-input-label">选取文件</label>
                <input type="file" id="fileInput" accept=".txt,.m3u,.m3u8" onchange="readFile(this)">
                <div class="file-name-display" id="fileNameDisplay"></div>
            </div>
            <textarea id="inputContent" placeholder="粘贴或上传 TXT / M3U 内容"></textarea>
            
            <div class="btn-group">
                <button class="blue" onclick="txtToM3u()">TXT → M3U</button>
                <button class="blue" onclick="m3uToTxt()">M3U → TXT</button>
                <button class="blue" onclick="onlyReplaceLink()">只替换链接</button>
                <button class="red" onclick="clearAll()">清空内容</button>
            </div>

            <div class="func-btn">
                <button class="green" onclick="downloadResult()">下载结果</button>
                <button class="green" onclick="copyResult()">复制结果</button>
                <button class="green" onclick="generateRepoSubLink()">生成订阅链接</button>
            </div>

            <!-- 仓库订阅地址容器（默认隐藏） -->
            <div class="input-item" id="repoSubLinkContainer">
                <label>订阅地址</label>
                <div class="sub-link-group">
                    <input id="repoSubLinkOutput" readonly>
                    <button class="green" onclick="copyRepoSubLink()">复制</button>
                </div>
            </div>

            <div class="download-tip">安卓手机请开启浏览器存储权限，下载后在通知栏查看</div>
            <textarea id="output" placeholder="处理结果" readonly></textarea>
        </div>
    </div>
    <div class="logo-preview-modal" id="logoPreviewModal" onclick="closeLogoPreview()">
        <div class="logo-preview-content" onclick="event.stopPropagation()">
            <img src="" alt="LOGO预览" class="logo-preview-img" id="previewImg">
            <button class="logo-preview-close" onclick="closeLogoPreview()">×</button>
        </div>
    </div>

    <script>
        const repoOwner = "1996TV";
        const repoName = "LOGO";
        const cdnBase = `https://cdn.jsdelivr.net/gh/${repoOwner}/${repoName}@main/`;
        let allLogoFiles = [];
        const DEFAULT_EPG_URL = "https://epg.catvod.com/epg.xml";
        const DEFAULT_LOGO_URL = "https://cdn.jsdelivr.net/gh/1996TV/LOGO@main/";
        const DEFAULT_CLEAN_KEYWORDS = ["高清", "HD", "超清"];

        function switchTab(panelId) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            document.querySelectorAll('.panel').forEach(panel => panel.classList.remove('active'));
            document.getElementById(panelId).classList.add('active');
        }

        window.onload = function() {
            document.getElementById('epgUrl').value = DEFAULT_EPG_URL;
            document.getElementById('logoUrlInput').value = DEFAULT_LOGO_URL;
            document.getElementById('fallbackLogoInput').value = "https://cdn.jsdelivr.net/gh/1996TV/LOGO@main/mytvsuper.png";
            clearAll();
            document.getElementById('cleanName').checked = true;
            document.getElementById('removeReplay').checked = true;
            document.getElementById('enableLinkReplace').checked = true;
        }

        async function fetchLogoFiles() {
            try {
                const repoInfoUrl = `https://api.github.com/repos/${repoOwner}/${repoName}`;
                const repoRes = await fetch(repoInfoUrl);
                if (!repoRes.ok) throw new Error(`获取仓库信息失败`);
                const repoData = await repoRes.json();
                const defaultBranch = repoData.default_branch;

                const treeUrl = `https://api.github.com/repos/${repoOwner}/${repoName}/git/trees/${defaultBranch}?recursive=1`;
                const treeRes = await fetch(treeUrl);
                if (!treeRes.ok) throw new Error(`获取目录树失败`);
                const treeData = await treeRes.json();

                allLogoFiles = treeData.tree
                    .filter(item => item.type === 'blob' && item.path.endsWith('.png'))
                    .map(item => ({
                        name: item.path.split('/').pop(),
                        downloadUrl: cdnBase + item.path.split('/').pop()
                    }));
            } catch (error) {
                console.error('拉取LOGO失败:', error);
            }
        }

        async function fuzzySearchLogo() {
            const key = document.getElementById('searchKey').value.trim().toLowerCase();
            if (!key) {
                alert('请输入关键词！');
                return;
            }
            const loading = document.getElementById('loading');
            const resultBox = document.getElementById('logoResult');
            loading.style.display = 'block';
            resultBox.style.display = 'none';
            try {
                if (allLogoFiles.length === 0) await fetchLogoFiles();
                const matchFiles = allLogoFiles.filter(file => file.name.toLowerCase().includes(key));
                loading.style.display = 'none';
                resultBox.style.display = 'block';
                if (matchFiles.length === 0) {
                    resultBox.innerHTML = '<p style="text-align:center; color:#999; padding:20px;">未找到匹配的LOGO文件</p>';
                    return;
                }
                let resultHtml = '';
                matchFiles.forEach(file => {
                    const logoName = file.name.replace('.png', '');
                    resultHtml += `
                        <div class="logo-item">
                            <div class="preview" onclick="openLogoPreview('${file.downloadUrl}')">
                                <img src="${file.downloadUrl}" alt="${logoName}" onerror="this.parentNode.innerHTML='<span class=placeholder>加载失败</span>'">
                            </div>
                            <div class="info">
                                <div class="name">${logoName}</div>
                                <div class="url">${file.downloadUrl}</div>
                            </div>
                            <button class="copy-btn" onclick="copyLogoUrl('${file.downloadUrl}')">复制</button>
                        </div>
                    `;
                });
                resultBox.innerHTML = resultHtml;
            } catch (error) {
                loading.style.display = 'none';
                resultBox.style.display = 'block';
                resultBox.innerHTML = `<p style="text-align:center; color:#f5222d; padding:20px;">搜索失败</p>`;
            }
        }

        function openLogoPreview(imgUrl) {
            const modal = document.getElementById('logoPreviewModal');
            const previewImg = document.getElementById('previewImg');
            previewImg.src = imgUrl;
            modal.style.display = 'flex';
        }

        function closeLogoPreview() {
            document.getElementById('logoPreviewModal').style.display = 'none';
        }

        function copyLogoUrl(url) {
            navigator.clipboard.writeText(url)
                .then(() => alert('LOGO链接复制成功！'))
                .catch(() => {
                    const textarea = document.createElement('textarea');
                    textarea.value = url;
                    document.body.appendChild(textarea);
                    textarea.select();
                    document.execCommand('copy');
                    document.body.removeChild(textarea);
                    alert('LOGO链接复制成功！');
                });
        }

        function readFile(input) {
            const file = input.files[0];
            if (!file) return;
            document.getElementById('fileNameDisplay').textContent = file.name;
            const reader = new FileReader();
            reader.onload = e => document.getElementById('inputContent').value = e.target.result;
            reader.readAsText(file);
        }

        function replaceLink(url) {
            if (!document.getElementById('enableLinkReplace').checked) return url;
            const oldPrefix = document.getElementById('oldLinkPrefix').value.trim();
            const newPrefix = document.getElementById('newLinkPrefix').value.trim();
            if (!oldPrefix || !newPrefix) return url;
            return url.replace(new RegExp(oldPrefix, 'g'), newPrefix);
        }

        function escapeRegExp(str) {
            return str.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
        }

        function cleanNameFn(n) {
            if (!document.getElementById('cleanName').checked) return n;
            let customKeywords = document.getElementById('customCleanKeywords').value.trim()
                .split(',').map(k => k.trim()).filter(k => k.length > 0);
            let allKeywords = [...new Set([...DEFAULT_CLEAN_KEYWORDS, ...customKeywords])];
            let cleanedName = n;
            allKeywords.forEach(keyword => {
                const safeKeyword = escapeRegExp(keyword);
                cleanedName = cleanedName.replace(new RegExp(safeKeyword, 'gi'), '');
            });
            return cleanedName.replace(/\s+/g, ' ').trim();
        }

        function isReplay(n) {
            return /(回看|回放|时移|Replay|Catchup|重播)/i.test(n);
        }

        async function txtToM3u() {
            const epg = document.getElementById('epgUrl').value.trim();
            const logoBase = document.getElementById('logoUrlInput').value.replace(/\/$/, '') + '/';
            const fallbackLogo = document.getElementById('fallbackLogoInput').value.trim();
            const input = document.getElementById('inputContent').value.trim();
            if (!input) return alert('请输入TXT内容！');
            if (allLogoFiles.length === 0) await fetchLogoFiles();
            const lines = input.split('\n');
            let output = `#EXTM3U x-tvg-url="${epg}"\n`;
            let group = '';
            lines.forEach(l => {
                l = l.trim();
                if (!l) return;
                if (l.endsWith(',#genre#')) {
                    group = l.replace(',#genre#', '');
                    return;
                }
                if (!l.includes(',')) return;
                const [name, url] = l.split(',');
                if (document.getElementById('removeReplay').checked && isReplay(name)) return;
                const cleanName = cleanNameFn(name);
                const playUrl = replaceLink(url);
                const logoExists = allLogoFiles.some(file => file.name.toLowerCase() === `${cleanName}.png`.toLowerCase());
                const finalLogoUrl = logoExists ? `${logoBase}${cleanName}.png` : fallbackLogo;
                output += `#EXTINF:-1 tvg-name="${cleanName}" tvg-logo="${finalLogoUrl}" group-title="${group}",${cleanName}\n${playUrl}\n`;
            });
            document.getElementById('output').value = output;
            await uploadToRepo();
        }

        async function m3uToTxt() {
            const input = document.getElementById('inputContent').value.trim();
            if (!input) return alert('请输入M3U内容！');
            const lines = input.split('\n');
            let output = '';
            let currentGroup = '';
            for (let i = 0; i < lines.length; i++) {
                const line = lines[i].trim();
                if (line.startsWith('#EXTINF')) {
                    const nameMatch = line.match(/,(.*)$/);
                    const groupMatch = line.match(/group-title="([^"]+)"/);
                    const name = nameMatch ? nameMatch[1].trim() : '';
                    const group = groupMatch ? groupMatch[1] : '默认分类';
                    if (document.getElementById('removeReplay').checked && isReplay(name)) {
                        i++;
                        continue;
                    }
                    if (group !== currentGroup) {
                        output += `${group},#genre#\n`;
                        currentGroup = group;
                    }
                    let url = lines[i + 1] ? lines[i + 1].trim() : '';
                    url = replaceLink(url);
                    const cleanName = cleanNameFn(name);
                    output += `${cleanName},${url}\n`;
                    i++;
                }
            }
            document.getElementById('output').value = output;
            await uploadToRepo();
        }

        async function onlyReplaceLink() {
            const input = document.getElementById('inputContent').value.trim();
            if (!input) return alert('请输入内容！');
            const oldPrefix = document.getElementById('oldLinkPrefix').value.trim();
            const newPrefix = document.getElementById('newLinkPrefix').value.trim();
            if (!oldPrefix || !newPrefix) return alert('请填写完整的新旧链接前缀！');
            const output = input.replace(new RegExp(oldPrefix, 'g'), newPrefix);
            document.getElementById('output').value = output;
            await uploadToRepo();
        }

        function downloadResult() {
            const content = document.getElementById('output').value.trim();
            if (!content) return alert('暂无内容可下载！');
            const ext = content.startsWith('#EXTM3U') ? 'm3u' : 'txt';
            const fileName = `iptv.${ext}`;
            try {
                const blob = new Blob([content], { type: 'application/octet-stream' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = fileName;
                document.body.appendChild(a);
                a.click();
                setTimeout(() => {
                    document.body.removeChild(a);
                    URL.revokeObjectURL(url);
                    alert(`✅ 下载已触发\n文件：${fileName}`);
                }, 1000);
            } catch (e) {
                alert('下载失败，请手动复制内容！');
            }
        }

        function copyResult() {
            const content = document.getElementById('output').value.trim();
            if (!content) return alert('暂无内容可复制！');
            navigator.clipboard.writeText(content)
                .then(() => alert('结果复制成功！'))
                .catch(() => {
                    const ta = document.createElement('textarea');
                    ta.value = content;
                    document.body.appendChild(ta);
                    ta.select();
                    document.execCommand('copy');
                    document.body.removeChild(ta);
                    alert('结果复制成功！');
                });
        }

        function clearAll() {
            document.getElementById('inputContent').value = '';
            document.getElementById('output').value = '';
            document.getElementById('fileNameDisplay').textContent = '';
            document.getElementById('repoSubLinkOutput').value = '';
            document.getElementById('searchKey').value = '';
            document.getElementById('logoResult').innerHTML = '';
            // 隐藏仓库订阅地址
            document.getElementById('repoSubLinkContainer').style.display = 'none';
        }

        (function handleSubRequest() {
            const params = new URLSearchParams(location.search);
            const sub = params.get('sub');
            if (!sub) return;
            try {
                const m3u = decodeURIComponent(escape(atob(sub)));
                document.body.innerText = m3u;
                document.head.innerHTML = `<meta charset="UTF-8"><title>IPTV Subscription</title>`;
            } catch (e) {
                document.body.innerText = '#EXTM3U\n# 订阅解析失败';
            }
        })();

        async function getFileSha(user, repo, path, token) {
            try {
                const response = await fetch(
                    `https://api.github.com/repos/${user}/${repo}/contents/${path}`,
                    {
                        headers: {
                            'Authorization': `token ${token}`,
                            'Accept': 'application/vnd.github.v3+json'
                        }
                    }
                );
                if (response.status === 404) return null;
                if (!response.ok) throw new Error(`获取SHA失败`);
                const data = await response.json();
                return data.sha;
            } catch (error) {
                console.error('获取SHA错误:', error);
                return null;
            }
        }

        async function uploadToRepo() {
            const user = document.getElementById('githubUser').value.trim();
            const repo = document.getElementById('githubRepo').value.trim();
            const token = document.getElementById('githubToken').value.trim();
            const path = document.getElementById('filePath').value.trim();
            const content = document.getElementById('output').value.trim();

            if (!user || !repo || !token || !path) {
                return alert('仓库配置缺失！');
            }
            if (!content) {
                return;
            }

            try {
                const contentBase64 = btoa(unescape(encodeURIComponent(content)));
                const sha = await getFileSha(user, repo, path, token);
                const requestBody = {
                    message: `Update IPTV subscription: ${new Date().toLocaleString()}`,
                    content: contentBase64,
                    branch: 'main'
                };
                if (sha) requestBody.sha = sha;

                const response = await fetch(
                    `https://api.github.com/repos/${user}/${repo}/contents/${path}`,
                    {
                        method: 'PUT',
                        headers: {
                            'Authorization': `token ${token}`,
                            'Accept': 'application/vnd.github.v3+json',
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify(requestBody)
                    }
                );

                if (!response.ok) {
                    const errData = await response.json();
                    throw new Error(`上传失败：${errData.message || response.status}`);
                }

                alert('文件成功上传到GitHub仓库！');
            } catch (error) {
                alert(`上传失败：${error.message}`);
                console.error(error);
            }
        }

        function generateRepoSubLink() {
            const user = document.getElementById('githubUser').value.trim();
            const repo = document.getElementById('githubRepo').value.trim();
            const path = document.getElementById('filePath').value.trim();

            if (!user || !repo || !path) {
                return alert('仓库配置缺失！');
            }

            const rawUrl = `https://raw.githubusercontent.com/${user}/${repo}/main/${path}`;
            document.getElementById('repoSubLinkOutput').value = rawUrl;
            // 显示仓库订阅地址容器
            document.getElementById('repoSubLinkContainer').style.display = 'block';
        }

        function copyRepoSubLink() {
            const subLink = document.getElementById('repoSubLinkOutput').value.trim();
            if (!subLink) return alert('暂无订阅链接可复制！');
            navigator.clipboard.writeText(subLink)
                .then(() => alert('订阅链接复制成功！'))
                .catch(() => {
                    const ta = document.createElement('textarea');
                    ta.value = subLink;
                    document.body.appendChild(ta);
                    ta.select();
                    document.execCommand('copy');
                    document.body.removeChild(ta);
                    alert('订阅链接复制成功！');
                });
        }
    </script>
</body>
