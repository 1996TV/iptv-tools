<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TXT ⇌ M3U 转换+链接批量替换工具</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            background: #f5f5f5;
            padding: 12px 8px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: #fff;
            padding: 16px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }
        h1 {
            text-align: center;
            font-size: 17px;
            color: #333;
            margin-bottom: 18px;
            font-weight: 600;
        }
        .input-item {
            margin-bottom: 14px;
        }
        .input-item label {
            font-size: 14px;
            color: #555;
            margin-bottom: 4px;
            display: block;
            line-height: 1.4;
        }
        .input-item input {
            width: 100%;
            padding: 12px 10px;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            font-size: 15px;
            background: #fafafa;
        }
        .input-item input:focus {
            outline: none;
            border-color: #1677ff;
            background: #fff;
        }
        .checkbox-item {
            display: flex;
            align-items: center;
            margin: 10px 0;
            font-size: 14px;
            color: #555;
            padding: 4px 0;
        }
        .checkbox-item input {
            width: 18px;
            height: 18px;
            margin-right: 8px;
            accent-color: #1677ff;
        }
        .upload-area {
            display: flex;
            align-items: center;
            gap: 8px;
            margin: 12px 0 16px;
        }
        .upload-btn {
            padding: 12px 20px;
            background: #1677ff;
            color: #fff;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 15px;
            white-space: nowrap;
        }
        #fileInput {
            display: none;
        }
        .file-tip {
            font-size: 13px;
            color: #999;
            flex: 1;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            line-height: 1.2;
        }
        textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            min-height: 180px;
            resize: vertical;
            font-size: 14px;
            margin-bottom: 16px;
            background: #fafafa;
            line-height: 1.5;
        }
        textarea:focus {
            outline: none;
            border-color: #1677ff;
            background: #fff;
        }
        .btn-group {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            margin-bottom: 16px;
        }
        .btn-group button {
            flex: 1;
            padding: 12px 0;
            background: #1677ff;
            color: #fff;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            min-width: 65px;
            font-size: 14px;
        }
        .btn-group button:hover {
            background: #0c66e4;
        }
        .download-select {
            margin-bottom: 16px;
        }
        .download-select select {
            width: 100%;
            padding: 12px 10px;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            font-size: 15px;
            background: #fafafa;
        }
        .download-select select:focus {
            outline: none;
            border-color: #1677ff;
        }
        .full-width-btn {
            width: 100%;
            padding: 14px 0;
            background: #1677ff;
            color: #fff;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 15px;
            margin-bottom: 16px;
        }
        .full-width-btn:hover {
            background: #0c66e4;
        }
        #output {
            min-height: 180px;
            background: #fafafa;
        }
        /* 历史记录样式 */
        .history-section {
            margin: 20px 0 10px;
        }
        .history-title {
            font-size: 15px;
            color: #333;
            margin-bottom: 8px;
            font-weight: 500;
        }
        .history-list {
            max-height: 150px;
            overflow-y: auto;
            border: 1px solid #eee;
            border-radius: 8px;
            padding: 8px;
        }
        .history-item {
            padding: 6px 8px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
            color: #555;
            margin-bottom: 4px;
        }
        .history-item:hover {
            background: #f0f7ff;
        }
        .history-item:last-child {
            margin-bottom: 0;
        }
        .clear-history-btn {
            width: 100%;
            padding: 8px 0;
            background: #f5f5f5;
            color: #666;
            border: 1px solid #eee;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            margin-top: 8px;
        }
        .clear-history-btn:hover {
            background: #f0f0f0;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>TXT ⇌ M3U 转换+链接批量替换工具</h1>

        <div class="input-item">
            <label>EPG 地址 (TXT → M3U)</label>
            <input type="text" id="epgUrl" value="https://ie.erw.cc/all.xml.gz" placeholder="EPG地址">
        </div>
        <div class="input-item">
            <label>Logo 基础地址 (结尾带 /)</label>
            <input type="text" id="logoUrl" value="https://cdn.jsdelivr.net/gh/1996TV/LOGO@main/" placeholder="https://xxx/LOGO/">
        </div>
        <div class="checkbox-item">
            <input type="checkbox" id="cleanName" checked>
            <label for="cleanName">净化频道名（去高清/HD/超清）</label>
        </div>

        <div class="input-item">
            <label>旧链接前缀</label>
            <input type="text" id="oldLinkPrefix" value="" placeholder="">
        </div>
        <div class="input-item">
            <label>新链接前缀</label>
            <input type="text" id="newLinkPrefix" value="" placeholder="">
        </div>
        <div class="checkbox-item">
            <input type="checkbox" id="enableLinkReplace" checked>
            <label for="enableLinkReplace">启用链接批量替换</label>
        </div>

        <div class="upload-area">
            <label for="fileInput" class="upload-btn">上传文件</label>
            <input type="file" id="fileInput" accept=".txt,.m3u,.m3u8">
            <span class="file-tip" id="fileTip">未选择文件</span>
        </div>

        <textarea id="inputContent" placeholder="粘贴内容，或上传文件"></textarea>

        <div class="btn-group">
            <button onclick="txtToM3u()">TXT → M3U</button>
            <button onclick="m3uToTxt()">M3U → TXT</button>
            <button onclick="onlyReplaceLink()">只替换链接</button>
            <button onclick="clearAll()">清空内容</button>
            <button onclick="copyResult()">复制结果</button>
        </div>

        <div class="download-select">
            <select id="downloadType">
                <option value="m3u">下载为 .m3u</option>
                <option value="txt">下载为 .txt</option>
            </select>
        </div>

        <button class="full-width-btn" onclick="downloadResult()">下载结果</button>
        <textarea id="output" placeholder="处理结果展示在这里" readonly></textarea>

        <!-- 历史记录区域 -->
        <div class="history-section">
            <div class="history-title">历史记录</div>
            <div class="history-list" id="historyList"></div>
            <button class="clear-history-btn" onclick="clearHistory()">清空历史记录</button>
        </div>
    </div>

    <script>
        const epgUrl = document.getElementById('epgUrl');
        const logoUrl = document.getElementById('logoUrl');
        const cleanName = document.getElementById('cleanName');
        const oldLinkPrefix = document.getElementById('oldLinkPrefix');
        const newLinkPrefix = document.getElementById('newLinkPrefix');
        const enableLinkReplace = document.getElementById('enableLinkReplace');
        const inputContent = document.getElementById('inputContent');
        const output = document.getElementById('output');
        const fileInput = document.getElementById('fileInput');
        const fileTip = document.getElementById('fileTip');
        const downloadType = document.getElementById('downloadType');
        const historyList = document.getElementById('historyList');
        const HISTORY_KEY = 'iptv_converter_history';
        const MAX_HISTORY = 10;

        // 初始化历史记录
        function initHistory() {
            const history = getHistory();
            renderHistory(history);
        }

        // 获取历史记录
        function getHistory() {
            const historyStr = localStorage.getItem(HISTORY_KEY);
            return historyStr ? JSON.parse(historyStr) : [];
        }

        // 保存历史记录
        function saveHistory(inputVal, outputVal, type) {
            const history = getHistory();
            const time = new Date().toLocaleString();
            const item = { input: inputVal, output: outputVal, type: type, time: time };
            // 去重 + 限制数量
            const newHistory = [item, ...history.filter(h => h.input !== inputVal)].slice(0, MAX_HISTORY);
            localStorage.setItem(HISTORY_KEY, JSON.stringify(newHistory));
            renderHistory(newHistory);
        }

        // 渲染历史记录
        function renderHistory(history) {
            historyList.innerHTML = '';
            history.forEach((item, index) => {
                const div = document.createElement('div');
                div.className = 'history-item';
                div.textContent = `[${item.type}] ${item.time}`;
                div.onclick = () => {
                    inputContent.value = item.input;
                    output.value = item.output;
                };
                historyList.appendChild(div);
            });
        }

        // 清空历史记录
        function clearHistory() {
            localStorage.removeItem(HISTORY_KEY);
            renderHistory([]);
            alert('历史记录已清空');
        }

        // 文件上传读取
        fileInput.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) {fileTip.textContent = '未选择文件';return;}
            fileTip.textContent = `已选：${file.name}`;
            const reader = new FileReader();
            reader.onload = function(event) {inputContent.value = event.target.result;};
            reader.readAsText(file, 'utf-8');
        });

        // 频道名净化 - 仅去高清/HD/超清
        function cleanChannelName(name) {
            if (!cleanName.checked) return name;
            return name.replace(/\s+/g, '').replace(/高清|HD|超清/g, '').replace(/[^a-zA-Z0-9\u4e00-\u9fa5]/g, '');
        }

        // 链接替换核心方法
        function replaceLinkPrefix(url) {
            if (!enableLinkReplace.checked || !oldLinkPrefix.value.trim()) return url;
            return url.replace(oldLinkPrefix.value.trim(), newLinkPrefix.value.trim());
        }

        // TXT 转 M3U (带链接替换+净化+历史记录)
        function txtToM3u() {
            const input = inputContent.value.trim();
            if (!input) {alert('请输入/上传内容');return;}
            const epg = epgUrl.value.trim();
            const logoBase = logoUrl.value.trim().replace(/\/$/, '') + '/'; 
            let lines = input.split('\n').map(line => line.trim()).filter(line => line);
            let m3uContent = `#EXTM3U x-tvg-url="${epg}"\n`;
            let currentGroup = ''; 
            lines.forEach(line => {
                if (line.endsWith(',#genre#')) {currentGroup = line.replace(',#genre#', '').trim();return;}
                if (line.includes(',')) {
                    const [name, url] = line.split(',').map(item => item.trim());
                    if (!name || !url) return;
                    const fmtName = cleanChannelName(name);
                    const newUrl = replaceLinkPrefix(url);
                    const logo = `${logoBase}${fmtName}.png`;
                    m3uContent += `#EXTINF:-1 tvg-id="${fmtName}" tvg-name="${fmtName}" tvg-logo="${logo}" group-title="${currentGroup}",${fmtName}\n${newUrl}\n`;
                }
            });
            output.value = m3uContent;
            saveHistory(input, m3uContent, 'TXT→M3U');
        }

        // M3U 转 TXT (带链接替换+历史记录)
        function m3uToTxt() {
            const input = inputContent.value.trim();
            if (!input) {alert('请输入/上传内容');return;}
            let lines = input.split('\n').map(line => line.trim()).filter(line => line);
            let txtContent = '';
            let lastGroup = ''; 
            for (let i = 0; i < lines.length; i++) {
                const line = lines[i];
                if (line.startsWith('#EXTINF')) {
                    const groupMatch = line.match(/group-title="([^"]+)"/);
                    const group = groupMatch ? groupMatch[1].trim() : '默认分类📡';
                    const nameMatch = line.match(/tvg-name="([^"]+)"/);
                    const name = nameMatch ? nameMatch[1].trim() : line.split(',').pop().trim();
                    let url = lines[i + 1] || '';
                    url = replaceLinkPrefix(url.trim());
                    if (group !== lastGroup) {txtContent += `${group},#genre#\n`;lastGroup = group;}
                    if (url.startsWith('http')) {txtContent += `${name},${url}\n`;i++;}
                }
            }
            output.value = txtContent;
            saveHistory(input, txtContent, 'M3U→TXT');
        }

        // 只替换链接 (带历史记录)
        function onlyReplaceLink() {
            const input = inputContent.value.trim();
            if (!input) {alert('请输入/上传内容');return;}
            if (!enableLinkReplace.checked || !oldLinkPrefix.value.trim()) {
                output.value = input;
                alert('未填写替换链接前缀');
                return;
            }
            const oldPre = oldLinkPrefix.value.trim();
            const newPre = newLinkPrefix.value.trim();
            const res = input.split('\n').map(line=>line.replace(oldPre,newPre)).join('\n');
            output.value = res;
            saveHistory(input, res, '仅替换链接');
        }

        // 清空全部
        function clearAll() {
            inputContent.value = '';
            output.value = '';
            fileTip.textContent = '未选择文件';
            fileInput.value = '';
        }

        // 复制结果
        function copyResult() {
            const content = output.value.trim();
            if (!content) {alert('暂无结果');return;}
            navigator.clipboard.writeText(content).then(()=>alert('复制成功')).catch(()=>{
                output.select();
                document.execCommand('copy');
                alert('复制成功');
            });
        }

        // 下载结果
        function downloadResult() {
            const content = output.value.trim();
            if (!content) {alert('暂无结果');return;}
            const type = downloadType.value;
            const blob = new Blob([content], { type: 'text/plain;charset=utf-8' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = `iptv.${type}`;
            a.click();
            URL.revokeObjectURL(a.href);
        }

        // 页面加载初始化历史记录
        window.onload = initHistory;
    </script>
</body>
</html>
